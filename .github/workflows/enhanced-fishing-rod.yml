name: Package Enhanced Fishing Rod

on:
  push:
    branches: [main]
    tags: ['enhanced-fishing-rod-v*']
    paths:
      - 'EnhancedFishingRod/**'
      - '.github/workflows/enhanced-fishing-rod.yml'
  pull_request:
    paths:
      - 'EnhancedFishingRod/**'
      - '.github/workflows/enhanced-fishing-rod.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Verify and package data-only Kiln mod
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate mod and package layout
        run: python3 -m unittest discover -s EnhancedFishingRod/tests -v
      - name: Build installable ZIP
        run: python3 EnhancedFishingRod/package.py
      - name: Upload Kiln ZIP
        uses: actions/upload-artifact@v4
        with:
          name: enhanced-fishing-rod-0.1.0
          path: dist/enhanced-fishing-rod-0.1.0.zip
          if-no-files-found: error
          retention-days: 90

  release:
    name: Attach ZIP to tagged GitHub release
    if: startsWith(github.ref, 'refs/tags/enhanced-fishing-rod-v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: enhanced-fishing-rod-0.1.0
          path: dist
      - name: Validate independent tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" == "enhanced-fishing-rod-v0.1.0" ]] || { echo "::error::Tag must be enhanced-fishing-rod-v0.1.0"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/enhanced-fishing-rod-0.1.0.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
