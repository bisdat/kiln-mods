name: Build Base Station Magic Storage (test only)

on:
  pull_request:
    paths:
      - 'BaseStationMagicStorage/**'
      - 'tests/base-station-magic-storage/**'
      - 'scripts/build-compat.py'
      - 'scripts/build-compat.sh'
      - 'scripts/resolve-kiln-release.py'
      - '.github/workflows/base-station-magic-storage.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bsms-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Compile and package experimental candidate
    runs-on: ubuntu-24.04
    env:
      KILN_RELEASE_TAG: v0.2.0-dev.29.14
      KILN_SDK_VERSION: 0.2.0-dev.29.14
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate contracts
        run: python3 -m unittest discover -s tests/base-station-magic-storage -p 'test_*.py' -v
      - name: Check official release SDK and compile mod
        run: bash scripts/build-compat.sh BaseStationMagicStorage
      - name: Verify package
        run: test -s bin/Release/base-station-magic-storage-0.1.0.zip
      - name: Upload candidate only, no GitHub Release
        uses: actions/upload-artifact@v4
        with:
          name: base-station-magic-storage-0.1.0
          path: |
            bin/Release/base-station-magic-storage-0.1.0.zip
            bin/Release/kiln-sdk-provenance.json
          if-no-files-found: error
          retention-days: 60
