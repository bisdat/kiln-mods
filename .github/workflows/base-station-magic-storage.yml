name: Package Base Station Magic Storage

on:
  push:
    branches: [main]
    paths:
      - 'BaseStationMagicStorage/**'
      - 'tests/base-station-magic-storage/**'
      - 'scripts/build-compat.py'
      - 'scripts/build-compat.sh'
      - 'scripts/resolve-kiln-release.py'
      - '.github/workflows/base-station-magic-storage.yml'
  pull_request:
    paths:
      - 'BaseStationMagicStorage/**'
      - 'tests/base-station-magic-storage/**'
      - 'scripts/build-compat.py'
      - 'scripts/build-compat.sh'
      - 'scripts/resolve-kiln-release.py'
      - '.github/workflows/base-station-magic-storage.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bsms-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Compile and package accepted mod
    runs-on: ubuntu-24.04
    env:
      KILN_RELEASE_TAG: v0.2.0-dev.29.17
      KILN_SDK_VERSION: 0.2.0-dev.29.17
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate contracts
        run: python3 -m unittest discover -s tests/base-station-magic-storage -p 'test_*.py' -v
      - name: Check official release SDK and compile mod
        run: bash scripts/build-compat.sh BaseStationMagicStorage
      - name: Verify package
        run: test -s bin/Release/base-station-magic-storage-0.1.4.zip
      - name: Upload installable package and SDK provenance
        uses: actions/upload-artifact@v4
        with:
          name: base-station-magic-storage-0.1.4
          path: |
            bin/Release/base-station-magic-storage-0.1.4.zip
            bin/Release/kiln-sdk-provenance.json
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish Base Station Magic Storage v0.1.4
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: base-station-magic-storage-0.1.4
          path: dist
      - name: Validate installable package and SDK provenance
        shell: bash
        run: |
          test -s dist/base-station-magic-storage-0.1.4.zip
          test -s dist/kiln-sdk-provenance.json
          python3 - <<'PY'
          import json
          data = json.load(open("dist/kiln-sdk-provenance.json", encoding="utf-8"))
          assert data["mod"] == "BaseStationMagicStorage"
          assert data["tag"] == "v0.2.0-dev.29.17"
          assert data["version"] == "0.2.0-dev.29.17"
          assert data["mod_source_sha"] == "${{ github.sha }}"
          print("Verified BSMS v0.1.4 build provenance")
          PY
      - name: Create version tag and publish accepted GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: base-station-magic-storage-v0.1.4
          target_commitish: ${{ github.sha }}
          name: Base Station Magic Storage v0.1.4
          prerelease: false
          draft: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Base Station Magic Storage v0.1.4 — two independently configurable output modes, Kiln dev.29.17 / mod API 0.2.9.

            - NEW: ShareOutputs checkbox (default ON) lends finished station outputs to same-base station fills and player crafting via Kiln #68, without first transferring them to Magic Chests.
            - CollectOutputs checkbox (default OFF) retains v0.1.3 collection into dedicated Magic Chests named crafting output. Both checkboxes appear in Insert -> Mods -> Configs -> Base Station Magic Storage.
            - Existing 26 per-type checkboxes and base opt-ins/exclusions continue controlling eligibility. Sharing registration is tracked and revoked when disabled.
            - If both output modes are ON, the timed collector may move output before crafting draws it directly. For in-place sharing, enable ShareOutputs and disable CollectOutputs.
            - Server transaction safety, queued-input/leftover exclusions, same-base limits and permission rules are supplied by the upstream Kiln API.
            - Workbench crafting menus require a Kiln client; the native station-screen Fill button may remain disabled where only outputs could supply it, while mod-driven Stations.Fill works.
            - In-game acceptance pending; CI validates the official SDK, contracts, package and provenance.
          files: |
            dist/base-station-magic-storage-0.1.4.zip
            dist/kiln-sdk-provenance.json
