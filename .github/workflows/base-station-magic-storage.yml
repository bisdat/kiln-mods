name: Package Base Station Magic Storage

on:
  push:
    branches: [main]
    paths:
      - 'BaseStationMagicStorage/**'
      - 'tests/base-station-magic-storage/**'
      - 'scripts/build-compat.py'
      - 'scripts/build-compat.sh'
      - 'scripts/resolve-kiln-release.py'
      - '.github/workflows/base-station-magic-storage.yml'
  pull_request:
    paths:
      - 'BaseStationMagicStorage/**'
      - 'tests/base-station-magic-storage/**'
      - 'scripts/build-compat.py'
      - 'scripts/build-compat.sh'
      - 'scripts/resolve-kiln-release.py'
      - '.github/workflows/base-station-magic-storage.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bsms-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Compile and package accepted mod
    runs-on: ubuntu-24.04
    env:
      KILN_RELEASE_TAG: v0.2.0-dev.29.17
      KILN_SDK_VERSION: 0.2.0-dev.29.17
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate contracts
        run: python3 -m unittest discover -s tests/base-station-magic-storage -p 'test_*.py' -v
      - name: Check official release SDK and compile mod
        run: bash scripts/build-compat.sh BaseStationMagicStorage
      - name: Verify package
        run: test -s bin/Release/base-station-magic-storage-0.1.4.zip
      - name: Upload installable package and SDK provenance
        uses: actions/upload-artifact@v4
        with:
          name: base-station-magic-storage-0.1.4
          path: |
            bin/Release/base-station-magic-storage-0.1.4.zip
            bin/Release/kiln-sdk-provenance.json
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish Base Station Magic Storage v0.1.4
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: base-station-magic-storage-0.1.4
          path: dist
      - name: Validate installable package and SDK provenance
        shell: bash
        run: |
          test -s dist/base-station-magic-storage-0.1.4.zip
          test -s dist/kiln-sdk-provenance.json
          python3 - <<'PY'
          import json
          data = json.load(open("dist/kiln-sdk-provenance.json", encoding="utf-8"))
          assert data["mod"] == "BaseStationMagicStorage"
          assert data["tag"] == "v0.2.0-dev.29.17"
          assert data["version"] == "0.2.0-dev.29.17"
          assert data["mod_source_sha"] == "${{ github.sha }}"
          print("Verified BSMS v0.1.4 build provenance")
          PY
      - name: Create version tag and publish accepted GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: base-station-magic-storage-v0.1.4
          target_commitish: ${{ github.sha }}
          name: Base Station Magic Storage v0.1.4
          prerelease: false
          draft: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Base Station Magic Storage v0.1.4 — in-place output sharing for supported production stations, via Kiln #68 (built with Kiln dev.29.17 / mod API 0.2.9).

            - ShareOutputs defaults ON: supported production stations automatically lend only eligible finished outputs within the same Flame Altar base. No per-base enablement, manual station opt-in, or Magic Chest transfer is required.
            - All 26 supported production-station type switches default ON and individually control sharing eligibility. Saved global configuration choices are respected.
            - CollectOutputs defaults OFF: optional collection into dedicated, deposit-enabled Magic Chests named 'crafting output' remains available.
            - Legacy per-base policy is retained ONLY for separately optional automatic filling/collection. Neither runs by default.
            - Native station ingredient counts and Fill controls are supported on Kiln 0.2.0-dev.29.19 beta 2+ with Kiln on client and server. Earlier Kiln runtimes can register output sources but native Fill UI may not see them.
            - Real-game acceptance PASS (20 Nov 2026): Forge showed 20 shared charcoal from Charcoal Kiln, consumed 2 directly using native Fill and produced 1 Metal Sheet. This is not a claim of completed queued-input, all-station-type, multiplayer or reload testing.
            - The server-side Kiln API enforces source classification, same-base membership and transaction permissions. Output sharing is not cross-base.
            - Verified CI: SDK compatibility, source contract tests and installable ZIP checks.
          files: |
            dist/base-station-magic-storage-0.1.4.zip
            dist/kiln-sdk-provenance.json
