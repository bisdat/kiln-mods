name: Experimental Kiln crafting transaction trace

on:
  push:
    branches: ['feature/cross-base-storage-kiln']
    paths:
      - 'sdk-proposals/native-craft-trace/**'
      - 'scripts/resolve-kiln-release.py'
      - '.github/workflows/kiln-craft-trace.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Resolve latest published Kiln dev (single exact commit)
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Find published Kiln release, not moving main
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 scripts/resolve-kiln-release.py
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          r = json.loads(Path('.kiln-release.json').read_text())
          if not re.fullmatch('[0-9a-fA-F]{40}', r['release_target']):
              raise SystemExit('Published Kiln tag has no immutable target commit; refuse unpinned experiment')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"tag={r['tag']}\nsha={r['release_target']}\n")
          print(f"Passive native source experiment: {r['tag']} @ {r['release_target']}")
          PY

  api:
    needs: release
    name: Native ABI and managed Rules on ${{ needs.release.outputs.tag }} (Linux)
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      KILN_UPSTREAM_SHA: ${{ needs.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Fetch exact published Kiln source
        shell: bash
        run: |
          git init -q .kiln-trace
          git -C .kiln-trace remote add origin https://github.com/frostdev-ops/kiln.git
          git -C .kiln-trace fetch --depth=1 origin "refs/tags/$RELEASE_TAG"
          git -C .kiln-trace checkout -q --detach 'FETCH_HEAD^{commit}'
          test "$(git -C .kiln-trace rev-parse HEAD)" = "$KILN_UPSTREAM_SHA"
      - name: Apply passive read-only payer/journal trace to existing native hooks
        run: |
          python3 sdk-proposals/native-craft-trace/native.py .kiln-trace
          python3 sdk-proposals/native-craft-trace/managed.py .kiln-trace
          python3 sdk-proposals/native-craft-trace/journal.py .kiln-trace
          python3 sdk-proposals/native-craft-trace/costs.py .kiln-trace
          python3 sdk-proposals/native-craft-trace/paired.py .kiln-trace
          git -C .kiln-trace diff --check
      - name: Compile 64/112/120/264-byte trace ABIs
        shell: bash
        run: |
          printf '#include "services/kiln_rules.h"\nstatic_assert(sizeof(KilnRulesCraftTrace) == 64);\nstatic_assert(sizeof(KilnRulesJournalTrace) == 112);\nstatic_assert(sizeof(KilnRulesCostTrace) == 120);\nstatic_assert(sizeof(KilnRulesPaymentTrace) == 264);\nint main() { return 0; }\n' | \
            c++ -std=c++20 -Wall -Wextra -Werror -x c++ -fsyntax-only -I .kiln-trace/native/core/abi -
      - name: Compile managed Kiln.Rules
        run: dotnet build .kiln-trace/managed/services/Kiln.Rules/Kiln.Rules.csproj --configuration Release
      - name: Enforce observer-only patch safety boundaries
        run: |
          python3 sdk-proposals/native-craft-trace/verify.py .kiln-trace
          echo 'PASS: passive native payer/journal/cost-row instrumentation; no new hook or inventory mutation.'

      - name: Stage precisely one patched managed Rules DLL (LAB only)
        shell: bash
        run: |
          mkdir -p .trace-managed
          mapfile -t libs < <(find .kiln-trace/managed/services/Kiln.Rules/bin -type f -path '*/Release/net10.0/Kiln.Rules.dll')
          if [[ "${#libs[@]}" != 1 ]]; then
            printf 'Expected one patched managed DLL, got %s\n' "${#libs[@]}" >&2
            exit 1
          fi
          cp "${libs[0]}" .trace-managed/Kiln.Rules.dll
          file .trace-managed/Kiln.Rules.dll
          sha256sum .trace-managed/Kiln.Rules.dll

      - uses: actions/upload-artifact@v4
        with:
          name: trace-managed-${{ needs.release.outputs.tag }}
          path: .trace-managed/Kiln.Rules.dll
          if-no-files-found: error
          retention-days: 30

  native:
    needs: release
    name: Compile native kiln-rules.dll on ${{ needs.release.outputs.tag }} (Windows)
    runs-on: windows-2022
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      KILN_UPSTREAM_SHA: ${{ needs.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact published Kiln source
        shell: pwsh
        run: |
          git init .kiln-trace
          git -C .kiln-trace remote add origin https://github.com/frostdev-ops/kiln.git
          git -C .kiln-trace fetch --depth=1 origin "refs/tags/$env:RELEASE_TAG"
          git -C .kiln-trace checkout --detach 'FETCH_HEAD^{commit}'
          $actual = git -C .kiln-trace rev-parse HEAD
          if ($actual.Trim() -ne $env:KILN_UPSTREAM_SHA) { throw "Kiln release ref changed: $actual" }
      - name: Apply and verify passive native trace
        shell: pwsh
        run: |
          python sdk-proposals/native-craft-trace/native.py .kiln-trace
          python sdk-proposals/native-craft-trace/managed.py .kiln-trace
          python sdk-proposals/native-craft-trace/journal.py .kiln-trace
          python sdk-proposals/native-craft-trace/costs.py .kiln-trace
          python sdk-proposals/native-craft-trace/paired.py .kiln-trace
          git -C .kiln-trace diff --check
          python sdk-proposals/native-craft-trace/verify.py .kiln-trace
      - name: Preserve known baseline MSVC symbol cast fix (CI only)
        shell: pwsh
        run: |
          python sdk-proposals/native-craft-trace/msvc-compat.py .kiln-trace
          git -C .kiln-trace diff --check
      - name: Configure native Win64
        shell: pwsh
        run: cmake -S .kiln-trace/native -B .kiln-trace/native/build/ci -G "Visual Studio 17 2022" -A x64
      - name: Compile patched native rules service (CI only)
        shell: pwsh
        run: cmake --build .kiln-trace/native/build/ci --config Release --target kiln-rules --parallel 4
      - name: Stage precisely one compiled native Rules DLL (LAB only)
        shell: pwsh
        run: |
          $matches = @(Get-ChildItem -Path .kiln-trace/native/build/ci -Recurse -File -Filter kiln-rules.dll)
          if ($matches.Count -ne 1) { throw "Expected one patched kiln-rules.dll, found $($matches.Count)" }
          New-Item -ItemType Directory -Force .trace-native | Out-Null
          Copy-Item $matches[0].FullName .trace-native/kiln-rules.dll
          Get-FileHash .trace-native/kiln-rules.dll -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: trace-native-${{ needs.release.outputs.tag }}
          path: .trace-native/kiln-rules.dll
          if-no-files-found: error
          retention-days: 30

      - name: Report isolated, uninstalled runtime experiment
        shell: pwsh
        run: |
          Write-Output 'PASS: native kiln-rules.dll compiled on exact released Kiln.'
          Write-Output 'LAB-only artifact is NOT deployed, installed or included in Cross-base Storage.'
 
  lab-bundle:
    name: LAB ONLY - matched native/managed trace plus admin observer
    needs: [release, api, native]
    if: needs.api.result == 'success' && needs.native.result == 'success'
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ github.token }}
      KILN_RELEASE_TAG: ${{ needs.release.outputs.tag }}
      KILN_UPSTREAM_SHA: ${{ needs.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download both independently compiled matching services
        uses: actions/download-artifact@v4
        with:
          pattern: trace-*-${{ needs.release.outputs.tag }}
          path: trace-input
          merge-multiple: false

      - name: Recheck observer's read-only guard and bounded output tests
        run: |
          python3 scripts/validate-craft-payment-trace.py
          dotnet run --project tests/craft-payment-trace/Trace.Tests.csproj -c Release

      - name: Build matching standard-SDK observer (no native hooks in mod)
        run: bash scripts/build.sh CraftPaymentTrace

      - name: Assemble noninstalling, version-locked lab artifact
        shell: bash
        run: |
          python3 sdk-proposals/native-craft-trace/package-lab.py \
            --native "trace-input/trace-native-$KILN_RELEASE_TAG/kiln-rules.dll" \
            --managed "trace-input/trace-managed-$KILN_RELEASE_TAG/Kiln.Rules.dll" \
            --observer bin/Release/craft-payment-trace-0.1.1.zip \
            --release .kiln-release.json \
            --out "craft-payment-trace-LAB-$KILN_RELEASE_TAG.zip"

      - name: Upload separately named manual lab inspection archive
        uses: actions/upload-artifact@v4
        with:
          name: craft-payment-trace-LAB-${{ needs.release.outputs.tag }}
          path: craft-payment-trace-LAB-*.zip
          if-no-files-found: error
          retention-days: 30
