name: Package Survival QoL

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'SurvivalQoL/**'
      - 'tests/survival-qol/**'
      - 'scripts/**'
      - 'NuGet.Config'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new commit supersedes an older package run on the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build and package mod
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout mods repository
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check release tag matches mod version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          mod_version="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' SurvivalQoL/SurvivalQoL.csproj)"
          if [[ -z "$mod_version" || "$GITHUB_REF_NAME" != "v$mod_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must match the mod project version v$mod_version"
            exit 1
          fi

      - name: Check oxygen and frost configuration and tick contracts
        run: python3 -m unittest discover -s tests/survival-qol -p 'test_*.py' -v

      - name: Pack pinned Kiln SDK and compile the mod
        run: bash scripts/build.sh

      - name: Upload installable Kiln package
        uses: actions/upload-artifact@v4
        with:
          name: survival-qol-package
          path: bin/Release/survival-qol-*.zip
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packaged mod
        uses: actions/download-artifact@v4
        with:
          name: survival-qol-package
          path: dist

      - name: Attach installable ZIP to versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/survival-qol-*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
