name: Diagnose upstream Kiln EML nested paths

on:
  push:
    branches:
      - diagnostic/kiln-eml-wine-path
    paths:
      - 'diagnostics/kiln-eml-path/**'
      - '.github/workflows/diagnose-kiln-eml-path.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  path-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile isolated path diagnostic
        run: rustc --edition=2021 --test diagnostics/kiln-eml-path/test.rs -o eml-path-test.exe
      - name: Check nested paths and escape protections
        run: ./eml-path-test.exe --nocapture

  wine-z-drive:
    name: Cross-compiled Windows diagnostic under Wine (Z-drive)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Windows Rust target and Wine runner
        run: |
          rustup target add x86_64-pc-windows-gnu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 wine wine64 xvfb
      - name: Check out exact upstream Kiln build used in failed boot
        uses: actions/checkout@v4
        with:
          repository: frostdev-ops/kiln
          ref: d35ee27c5c4f1f31b1c4a3503636a653d6d3ae63
          path: kiln-upstream
          persist-credentials: false
      - name: Stage real EML FileSystem integration regression
        run: |
          mkdir -p kiln-upstream/gpl/kiln-eml/eml/mod-loader-base/tests
          cp diagnostics/kiln-eml-path/eml_disk_fs.rs \
             kiln-upstream/gpl/kiln-eml/eml/mod-loader-base/tests/eml_disk_fs.rs
      - name: Cross-compile pinned mod-loader-base integration test
        run: |
          cd kiln-upstream/gpl/kiln-eml
          cargo test -p mod-loader-base --target x86_64-pc-windows-gnu --test eml_disk_fs --no-run
      - name: Run pinned EML FileSystem under Wine
        env:
          WINEDEBUG: "-all"
          WINEPREFIX: ${{ runner.temp }}/kiln-eml-wine
          WINEARCH: win64
          KILN_EML_TEST_USE_CWD: "1"
        run: |
          exe="$(find kiln-upstream/gpl/kiln-eml/target/x86_64-pc-windows-gnu/debug/deps \
            -type f -name 'eml_disk_fs-*.exe' -print -quit)"
          test -n "$exe"
          xvfb-run -a wine "$exe" --nocapture
      - name: Test EML reader with Fedora-style symlinked home
        env:
          WINEDEBUG: "-all"
          WINEPREFIX: ${{ runner.temp }}/kiln-eml-wine
          WINEARCH: win64
        run: |
          mkdir -p "$GITHUB_WORKSPACE/silverblue/home"
          mkdir -p "$GITHUB_WORKSPACE/silverblue/var/home/clive"
          ln -s "$GITHUB_WORKSPACE/silverblue/var/home/clive" \
            "$GITHUB_WORKSPACE/silverblue/home/clive"
          export KILN_EML_TEST_BASE="$(python3 - <<'PY'
          import os
          p = os.path.join(os.environ["GITHUB_WORKSPACE"], "silverblue", "home", "clive")
          print("Z:" + p.replace("/", "\\"))
          PY
          )"
          echo "Wine test uses emulated Z:-mapped symlinked /home path"
          exe="$(find kiln-upstream/gpl/kiln-eml/target/x86_64-pc-windows-gnu/debug/deps \
            -type f -name 'eml_disk_fs-*.exe' -print -quit)"
          test -n "$exe"
          xvfb-run -a wine "$exe" --nocapture
      - name: Stage read-only EML Library probe
        run: |
          mkdir -p kiln-upstream/gpl/kiln-eml/eml/mod-loader-base/src/bin
          cp diagnostics/kiln-eml-path/eml_readonly_probe.rs \
             kiln-upstream/gpl/kiln-eml/eml/mod-loader-base/src/bin/eml-readonly-probe.rs
      - name: Cross-compile installed-library read-only probe
        run: |
          cd kiln-upstream/gpl/kiln-eml
          cargo build -p mod-loader-base --target x86_64-pc-windows-gnu --bin eml-readonly-probe
      - name: Smoke-test read-only probe with Wine against existing files
        env:
          WINEDEBUG: "-all"
          WINEPREFIX: ${{ runner.temp }}/kiln-eml-wine
          WINEARCH: win64
        run: |
          fixture="$GITHUB_WORKSPACE/readonly-fixture/library/eml/flame-altar-expanded/0.1.1+hash"
          mkdir -p "$fixture/src"
          printf '{"id":"flame-altar-expanded"}' > "$fixture/mod.json"
          printf '%s\n' 'return true' > "$fixture/src/mod.lua"
          winpath="$(python3 - "$fixture" <<'PY'
          import sys
          print("Z:" + sys.argv[1].replace("/", chr(92)))
          PY
          )"
          exe="kiln-upstream/gpl/kiln-eml/target/x86_64-pc-windows-gnu/debug/eml-readonly-probe.exe"
          xvfb-run -a wine "$exe" "$winpath"
      - name: Validate safe runner shell syntax and lifecycle
        run: |
          bash -n diagnostics/kiln-eml-path/run-with-proton.sh
          bash diagnostics/kiln-eml-path/test_runner.sh
      - name: Stage Windows probe and instructions
        run: |
          mkdir -p probe-dist
          cp kiln-upstream/gpl/kiln-eml/target/x86_64-pc-windows-gnu/debug/eml-readonly-probe.exe probe-dist/
          cp diagnostics/kiln-eml-path/run-with-proton.sh probe-dist/
          cp diagnostics/kiln-eml-path/README.md probe-dist/README.md
      - name: Publish read-only diagnostic (NOT a mod)
        uses: actions/upload-artifact@v4
        with:
          name: kiln-eml-readonly-proton-diagnostic-v2
          path: probe-dist/
          if-no-files-found: error
          retention-days: 30
      - name: Compile native Windows executable for Wine
        run: |
          rustc --edition=2021 --test \
            --target x86_64-pc-windows-gnu \
            -C linker=x86_64-w64-mingw32-gcc \
            diagnostics/kiln-eml-path/test.rs \
            -o eml-path-wine.exe
      - name: Run Z-mapped Library path tests in Wine
        env:
          WINEDEBUG: "-all"
          WINEPREFIX: ${{ runner.temp }}/kiln-eml-wine
          WINEARCH: win64
          KILN_EML_TEST_USE_CWD: "1"
        run: xvfb-run -a wine ./eml-path-wine.exe --nocapture
