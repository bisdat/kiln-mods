name: Package Building Tools for Kiln

on:
  push:
    branches:
      - main
      - feature/cross-base-storage-kiln
    tags:
      - 'building-tools-kiln-v*'
  pull_request:
    paths:
      - 'tools/package-buildingtools-for-kiln.py'
      - 'tools/buildingtools-release.json'
      - 'tests/test_buildingtools_adapter.py'
      - '.github/workflows/buildingtools-kiln-native-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Regression-test packaging, hostile archives and reproducibility
        run: python3 -m unittest discover -s tests -p 'test_buildingtools_adapter.py' -v
      - name: Verify production upstream version, exact pin and release version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p=json.load(open("tools/buildingtools-release.json"))
          assert p["adapter_version"]=="1.0.0"
          assert p["upstream_version"]=="0.31.2"
          assert p["upstream_sha256"]=="416b615ff854b6bd332074eb52731a4bc485fb510cc1779b772258dfeb5ec5fe"
          print("PASS pinned upstream release and production adapter 1.0.0")
          PY
      - name: Download official pinned Building Tools release and published SHA256
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://github.com/AleksanderWojtal-CC/Enshrouded-BuildingTools/releases/download/v0.31.2
          curl --fail --location --retry 3 "$BASE/EnshroudedBuildingTools-0.31.2.zip" -o /tmp/EnshroudedBuildingTools-0.31.2.zip
          curl --fail --location --retry 3 "$BASE/EnshroudedBuildingTools-0.31.2.zip.sha256" -o /tmp/EnshroudedBuildingTools-0.31.2.zip.sha256
          printf '%s  %s\n' \
            416b615ff854b6bd332074eb52731a4bc485fb510cc1779b772258dfeb5ec5fe \
            /tmp/EnshroudedBuildingTools-0.31.2.zip | sha256sum --check
      - name: Build stable Kiln native mod package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 tools/package-buildingtools-for-kiln.py \
            /tmp/EnshroudedBuildingTools-0.31.2.zip \
            --checksum /tmp/EnshroudedBuildingTools-0.31.2.zip.sha256 \
            --output dist/building-tools-kiln-1.0.0.zip
          (cd dist && sha256sum building-tools-kiln-1.0.0.zip > building-tools-kiln-1.0.0.zip.sha256)
      - name: Validate exact upstream DLL/LICENCE and stable package contents
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,zipfile
          base="kiln/native/building-tools/"
          with zipfile.ZipFile("dist/building-tools-kiln-1.0.0.zip") as pkg, \
              zipfile.ZipFile("/tmp/EnshroudedBuildingTools-0.31.2.zip") as upstream:
              names=set(pkg.namelist())
              assert "dinput8.dll" not in names
              assert not any(n.endswith("/dinput8.dll") for n in names)
              assert not any(n.startswith("/") or ".." in n.split("/") for n in names)
              assert pkg.read(base+"BuildingTools.dll")==upstream.read("dinput8.dll")
              assert pkg.read(base+"BuildingTools-LICENSE.txt")==upstream.read("BuildingTools-LICENSE.txt")
              assert pkg.read(base+"BuildingTools-README.txt")==upstream.read("BuildingTools-README.txt")
              manifest=json.loads(pkg.read(base+"native.json"))
              assert manifest["id"]=="building-tools"
              assert manifest["version"]=="1.0.0" and manifest["phase"]=="boot"
              assert manifest["side"]=="client" and manifest["dlls"]==["BuildingTools.dll"]
              assert manifest["init"] is None
              assert "BuildingTools-Languages/en.txt" in names
              provenance=json.loads(pkg.read(base+"provenance.json"))
              assert provenance["upstream_archive_sha256"]=="416b615ff854b6bd332074eb52731a4bc485fb510cc1779b772258dfeb5ec5fe"
          print("PASS: upstream bytes unchanged, licence retained, proper Kiln manifest, no loader replacement")
          PY
          python3 tools/package-buildingtools-for-kiln.py \
            /tmp/EnshroudedBuildingTools-0.31.2.zip \
            --checksum /tmp/EnshroudedBuildingTools-0.31.2.zip.sha256 \
            --output /tmp/building-tools-kiln-1.0.0-repeat.zip
          cmp dist/building-tools-kiln-1.0.0.zip /tmp/building-tools-kiln-1.0.0-repeat.zip
          echo "PASS deterministic full ZIP bytes"
      - name: Upload installable package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: building-tools-kiln-1.0.0
          path: |
            dist/building-tools-kiln-1.0.0.zip
            dist/building-tools-kiln-1.0.0.zip.sha256
          retention-days: 30
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/building-tools-kiln-v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Ensure tag matches approved package version
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "building-tools-kiln-v1.0.0"
      - uses: actions/download-artifact@v4
        with:
          name: building-tools-kiln-1.0.0
          path: dist
      - name: Publish versioned release with its checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check building-tools-kiln-1.0.0.zip.sha256)
          cat > release-notes.md <<'NOTES'
          Official Enshrouded Building Tools 0.31.2 by Aleksander Wojtal (MIT),
          packaged as a Kiln-native mod without changing its original DLL.

          The adapted loader and cross-base Magic Chest access have been
          confirmed working by a user under Kiln on Linux Steam/Proton.
          Exact-once remote debit, rollback, multiplayer and newer game
          builds are not yet separately verified.

          Install: extract building-tools-kiln-1.0.0.zip into the folder
          containing enshrouded.exe. Keep Kiln's original dinput8.dll.
          Enable: Home > Options > Magic chests of all bases.
          Existing BuildingTools.ini is never overwritten.

          Previous experimental native research is archived on branch
          archive/cross-base-storage-native-research-2026-11-09.
          NOTES
          gh release create "$GITHUB_REF_NAME" \
            dist/building-tools-kiln-1.0.0.zip \
            dist/building-tools-kiln-1.0.0.zip.sha256 \
            --verify-tag --latest=false \
            --title "Building Tools for Kiln 1.0.0" \
            --notes-file release-notes.md
