name: Package Building Tools for Kiln

on:
  push:
    branches: [main]
    tags: ['building-tools-kiln-v*']
  pull_request:
    paths:
      - 'BuildingToolsKiln/**'
      - '.github/workflows/buildingtools-kiln-native-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Packaging and upstream-update regression tests
        run: python3 -m unittest discover -s BuildingToolsKiln/tests -p 'test_*.py' -v
      - name: Load reviewed release profile
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json,re
          p=json.load(open("BuildingToolsKiln/release.json"))
          for key in ("adapter_version","upstream_version","gameplay_verified_upstream_version"):
              assert re.fullmatch(r"\d+\.\d+\.\d+",p[key]),key
          assert re.fullmatch(r"[0-9a-f]{64}",p["upstream_sha256"])
          print("adapter="+p["adapter_version"])
          print("upstream="+p["upstream_version"])
          print("checksum="+p["upstream_sha256"])
          PY
      - name: Download official pinned upstream ZIP and checksum
        env:
          UPSTREAM: ${{ steps.pin.outputs.upstream }}
          PIN: ${{ steps.pin.outputs.checksum }}
        run: |
          set -euo pipefail
          BASE="https://github.com/AleksanderWojtal-CC/Enshrouded-BuildingTools/releases/download/v$UPSTREAM"
          curl -fsSL --retry 3 "$BASE/EnshroudedBuildingTools-$UPSTREAM.zip" -o "/tmp/EnshroudedBuildingTools-$UPSTREAM.zip"
          curl -fsSL --retry 3 "$BASE/EnshroudedBuildingTools-$UPSTREAM.zip.sha256" -o "/tmp/EnshroudedBuildingTools-$UPSTREAM.zip.sha256"
          printf '%s  %s\n' "$PIN" "/tmp/EnshroudedBuildingTools-$UPSTREAM.zip" | sha256sum --check
      - name: Produce versioned install ZIP and checksum
        env:
          ADAPTER: ${{ steps.pin.outputs.adapter }}
          UPSTREAM: ${{ steps.pin.outputs.upstream }}
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 BuildingToolsKiln/package.py \
            "/tmp/EnshroudedBuildingTools-$UPSTREAM.zip" \
            --checksum "/tmp/EnshroudedBuildingTools-$UPSTREAM.zip.sha256" \
            --output "dist/building-tools-kiln-$ADAPTER.zip"
          (cd dist && sha256sum "building-tools-kiln-$ADAPTER.zip" > "building-tools-kiln-$ADAPTER.zip.sha256")
      - name: Validate DLL, licence, native manifest and reproducible bytes
        env:
          ADAPTER: ${{ steps.pin.outputs.adapter }}
          UPSTREAM: ${{ steps.pin.outputs.upstream }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,zipfile
          p=json.load(open("BuildingToolsKiln/release.json"))
          root="kiln/native/building-tools/"
          with zipfile.ZipFile("dist/building-tools-kiln-"+os.environ["ADAPTER"]+".zip") as z, \
               zipfile.ZipFile("/tmp/EnshroudedBuildingTools-"+os.environ["UPSTREAM"]+".zip") as u:
              names=set(z.namelist())
              assert not any(n.startswith("/") or ".." in n.split("/") for n in names)
              assert not any(n.casefold()=="dinput8.dll" or n.casefold().endswith("/dinput8.dll") for n in names)
              assert z.read(root+"BuildingTools.dll")==u.read("dinput8.dll")
              assert z.read(root+"BuildingTools-LICENSE.txt")==u.read("BuildingTools-LICENSE.txt")
              assert z.read(root+"BuildingTools-README.txt")==u.read("BuildingTools-README.txt")
              assert any(n.startswith("BuildingTools-Languages/") for n in names)
              m=json.loads(z.read(root+"native.json"))
              assert m["id"]=="building-tools" and m["version"]==p["adapter_version"]
              assert m["dlls"]==["BuildingTools.dll"] and m["side"]=="client"
              prov=json.loads(z.read(root+"provenance.json"))
              assert prov["upstream_archive_sha256"]==p["upstream_sha256"]
          print("PASS upstream bytes identical, licence and translations retained, Kiln dinput8.dll untouched")
          PY
          python3 BuildingToolsKiln/package.py \
            "/tmp/EnshroudedBuildingTools-$UPSTREAM.zip" \
            --checksum "/tmp/EnshroudedBuildingTools-$UPSTREAM.zip.sha256" \
            --output "/tmp/building-tools-kiln-$ADAPTER-repeat.zip"
          cmp "dist/building-tools-kiln-$ADAPTER.zip" "/tmp/building-tools-kiln-$ADAPTER-repeat.zip"
          echo "PASS deterministic build"
      - uses: actions/upload-artifact@v4
        with:
          name: building-tools-kiln-${{ steps.pin.outputs.adapter }}
          path: |
            dist/building-tools-kiln-${{ steps.pin.outputs.adapter }}.zip
            dist/building-tools-kiln-${{ steps.pin.outputs.adapter }}.zip.sha256
          retention-days: 30
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/building-tools-kiln-v') || github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Gate publication on explicit upstream gameplay acceptance
        id: pin
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p=json.load(open("BuildingToolsKiln/release.json"))
          assert p["upstream_version"]==p["gameplay_verified_upstream_version"], "New upstream version requires manual game acceptance before release"
          print("adapter="+p["adapter_version"])
          print("upstream="+p["upstream_version"])
          PY
      - name: Create approved version tag, or verify existing tag
        env:
          ADAPTER: ${{ steps.pin.outputs.adapter }}
        run: |
          set -euo pipefail
          TAG="building-tools-kiln-v$ADAPTER"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "$TAG"
          else
            test "$GITHUB_REF" = refs/heads/main
            git fetch --tags origin
            if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
              git tag "$TAG" "$GITHUB_SHA"
              git push origin "refs/tags/$TAG"
            fi
          fi
      - uses: actions/download-artifact@v4
        with:
          name: building-tools-kiln-${{ steps.pin.outputs.adapter }}
          path: dist
      - name: Publish immutable versioned ZIP and SHA256 on GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADAPTER: ${{ steps.pin.outputs.adapter }}
          UPSTREAM: ${{ steps.pin.outputs.upstream }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check "building-tools-kiln-$ADAPTER.zip.sha256")
          TAG="building-tools-kiln-v$ADAPTER"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Existing release retained; no assets overwritten"
            exit 0
          fi
          cat > /tmp/buildingtools-release.md <<NOTES
          Building Tools for Kiln $ADAPTER. Official upstream Building Tools
          $UPSTREAM by Aleksander Wojtal, MIT-licensed, unchanged DLL.

          No replacement of Kiln's dinput8.dll. Install the ZIP in the
          Enshrouded game root, preserving your BuildingTools.ini.
          Enable cross-base Magic Chests via Home > Options.
          Source and upstream update process:
          https://github.com/bisdat/kiln-mods/tree/main/BuildingToolsKiln
          NOTES
          gh release create "$TAG" \
            "dist/building-tools-kiln-$ADAPTER.zip" \
            "dist/building-tools-kiln-$ADAPTER.zip.sha256" \
            --verify-tag --latest=false \
            --title "Building Tools for Kiln $ADAPTER" \
            --notes-file /tmp/buildingtools-release.md
