name: Package Building Tools for Kiln

on:
  push:
    branches: [main]
    tags: ['building-tools-kiln-v*']
  pull_request:
    paths:
      - 'BuildingToolsKiln/**'
      - '.github/workflows/buildingtools-kiln-native-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    outputs:
      release_permitted: ${{ steps.release_gate.outputs.permitted }}
    steps:
      - uses: actions/checkout@v4
      - name: Packaging and upstream-update regression tests
        run: python3 -m unittest discover -s BuildingToolsKiln/tests -p 'test_*.py' -v
      - name: Load reviewed release profile
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json,re
          p=json.load(open("BuildingToolsKiln/release.json"))
          for key in ("adapter_version","upstream_version","gameplay_verified_upstream_version"):
              assert re.fullmatch(r"\d+\.\d+\.\d+",p[key]),key
          assert re.fullmatch(r"[0-9a-f]{64}",p["upstream_sha256"])
          print("adapter="+p["adapter_version"])
          print("upstream="+p["upstream_version"])
          print("checksum="+p["upstream_sha256"])
          PY
      - name: Evaluate release permission (informational, never authorises a new version)
        id: release_gate
        shell: bash
        run: |
          set -euo pipefail
          python3 BuildingToolsKiln/release_permission.py >> "$GITHUB_OUTPUT"
      - name: Find checksum asset for the exact pinned upstream release
        id: upstream_assets
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: ${{ steps.pin.outputs.upstream }}
        run: |
          set -euo pipefail
          gh api "repos/AleksanderWojtal-CC/Enshrouded-BuildingTools/releases/tags/v$UPSTREAM" \
            > /tmp/building-tools-upstream-release.json
          python3 BuildingToolsKiln/release_assets.py \
            /tmp/building-tools-upstream-release.json > /tmp/building-tools-assets.env
          grep -Fx "version=$UPSTREAM" /tmp/building-tools-assets.env
          grep -Fx 'ready=true' /tmp/building-tools-assets.env
          cat /tmp/building-tools-assets.env >> "$GITHUB_OUTPUT"
      - name: Download official pinned upstream ZIP and checksum
        env:
          UPSTREAM: ${{ steps.pin.outputs.upstream }}
          PIN: ${{ steps.pin.outputs.checksum }}
          CHECKSUM_ASSET: ${{ steps.upstream_assets.outputs.checksum_asset }}
        run: |
          set -euo pipefail
          BASE="https://github.com/AleksanderWojtal-CC/Enshrouded-BuildingTools/releases/download/v$UPSTREAM"
          mkdir -p /tmp/buildingtools-official-checksums
          curl -fsSL --retry 3 "$BASE/EnshroudedBuildingTools-$UPSTREAM.zip" -o "/tmp/EnshroudedBuildingTools-$UPSTREAM.zip"
          curl -fsSL --retry 3 "$BASE/$CHECKSUM_ASSET" -o "/tmp/buildingtools-official-checksums/$CHECKSUM_ASSET"
          python3 BuildingToolsKiln/official_checksum.py \
            --archive "/tmp/EnshroudedBuildingTools-$UPSTREAM.zip" \
            --checksum "/tmp/buildingtools-official-checksums/$CHECKSUM_ASSET" \
            --normalized "/tmp/EnshroudedBuildingTools-$UPSTREAM.zip.sha256" \
            --expected-sha256 "$PIN"
      - name: Produce versioned install ZIP and checksum
        env:
          ADAPTER: ${{ steps.pin.outputs.adapter }}
          UPSTREAM: ${{ steps.pin.outputs.upstream }}
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 BuildingToolsKiln/package.py \
            "/tmp/EnshroudedBuildingTools-$UPSTREAM.zip" \
            --checksum "/tmp/EnshroudedBuildingTools-$UPSTREAM.zip.sha256" \
            --output "dist/building-tools-kiln-$ADAPTER.zip"
          (cd dist && sha256sum "building-tools-kiln-$ADAPTER.zip" > "building-tools-kiln-$ADAPTER.zip.sha256")
      - name: Validate DLL, licence, native manifest and reproducible bytes
        env:
          ADAPTER: ${{ steps.pin.outputs.adapter }}
          UPSTREAM: ${{ steps.pin.outputs.upstream }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,zipfile
          p=json.load(open("BuildingToolsKiln/release.json"))
          root="kiln/native/building-tools/"
          with zipfile.ZipFile("dist/building-tools-kiln-"+os.environ["ADAPTER"]+".zip") as z, \
               zipfile.ZipFile("/tmp/EnshroudedBuildingTools-"+os.environ["UPSTREAM"]+".zip") as u:
              names=set(z.namelist())
              assert not any(n.startswith("/") or ".." in n.split("/") for n in names)
              assert not any(n.casefold()=="dinput8.dll" or n.casefold().endswith("/dinput8.dll") for n in names)
              assert z.read(root+"BuildingTools.dll")==u.read("dinput8.dll")
              assert z.read(root+"BuildingTools-LICENSE.txt")==u.read("BuildingTools-LICENSE.txt")
              assert z.read(root+"BuildingTools-README.txt")==u.read("BuildingTools-README.txt")
              assert any(n.startswith("BuildingTools-Languages/") for n in names)
              m=json.loads(z.read(root+"native.json"))
              assert m["id"]=="building-tools" and m["version"]==p["adapter_version"]
              assert m["dlls"]==["BuildingTools.dll"] and m["side"]=="client"
              prov=json.loads(z.read(root+"provenance.json"))
              assert prov["upstream_archive_sha256"]==p["upstream_sha256"]
          print("PASS upstream bytes identical, licence and translations retained, Kiln dinput8.dll untouched")
          PY
          python3 BuildingToolsKiln/package.py \
            "/tmp/EnshroudedBuildingTools-$UPSTREAM.zip" \
            --checksum "/tmp/EnshroudedBuildingTools-$UPSTREAM.zip.sha256" \
            --output "/tmp/building-tools-kiln-$ADAPTER-repeat.zip"
          cmp "dist/building-tools-kiln-$ADAPTER.zip" "/tmp/building-tools-kiln-$ADAPTER-repeat.zip"
          echo "PASS deterministic build"
      - uses: actions/upload-artifact@v4
        with:
          name: building-tools-kiln-${{ steps.pin.outputs.adapter }}
          path: |
            dist/building-tools-kiln-${{ steps.pin.outputs.adapter }}.zip
            dist/building-tools-kiln-${{ steps.pin.outputs.adapter }}.zip.sha256
          retention-days: 30
          if-no-files-found: error

  release:
    if: (startsWith(github.ref, 'refs/tags/building-tools-kiln-v') || github.ref == 'refs/heads/main') && needs.package.outputs.release_permitted == 'true'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Gate publication on gameplay verification or version-specific owner approval
        id: pin
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p=json.load(open("BuildingToolsKiln/release.json"))
          verified=p["upstream_version"]==p["gameplay_verified_upstream_version"]
          manual=p.get("release_approved_upstream_version")==p["upstream_version"]
          assert verified or manual, "New upstream version requires gameplay verification or explicit version-specific owner release approval"
          if manual and not verified:
              assert p.get("release_approval_note"), "Unverified owner approval requires an explanatory release note"
          print("adapter="+p["adapter_version"])
          print("upstream="+p["upstream_version"])
          print("prerelease="+("false" if verified else "true"))
          print("release_basis="+("gameplay_verified" if verified else "owner_approved_unverified"))
          PY
      - name: Create approved version tag, or verify existing tag
        env:
          ADAPTER: ${{ steps.pin.outputs.adapter }}
        run: |
          set -euo pipefail
          TAG="building-tools-kiln-v$ADAPTER"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "$TAG"
          else
            test "$GITHUB_REF" = refs/heads/main
            git fetch --tags origin
            if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
              git tag "$TAG" "$GITHUB_SHA"
              git push origin "refs/tags/$TAG"
            fi
          fi
      - uses: actions/download-artifact@v4
        with:
          name: building-tools-kiln-${{ steps.pin.outputs.adapter }}
          path: dist
      - name: Publish immutable versioned ZIP and SHA256 on GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADAPTER: ${{ steps.pin.outputs.adapter }}
          UPSTREAM: ${{ steps.pin.outputs.upstream }}
          PRERELEASE: ${{ steps.pin.outputs.prerelease }}
          RELEASE_BASIS: ${{ steps.pin.outputs.release_basis }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check "building-tools-kiln-$ADAPTER.zip.sha256")
          TAG="building-tools-kiln-v$ADAPTER"
          cat > /tmp/buildingtools-release.md <<NOTES
          Building Tools for Kiln $ADAPTER. Official upstream Building Tools
          $UPSTREAM by Aleksander Wojtal, MIT-licensed, unchanged DLL.

          No replacement of Kiln's dinput8.dll. Install the ZIP in the
          Enshrouded game root, preserving your BuildingTools.ini.
          Enable cross-base Magic Chests via Home > Options.
          Source and upstream update process:
          https://github.com/bisdat/kiln-mods/tree/main/BuildingToolsKiln
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Promotion is allowed only when the very same packaged bytes
            # have now been accepted in game; the tag and assets remain intact.
            current_pre="$(gh release view "$TAG" --json isPrerelease --jq '.isPrerelease')"
            if [[ "$PRERELEASE" == "false" && "$current_pre" == "true" ]]; then
              mkdir -p /tmp/building-tools-published
              gh release download "$TAG" -p "building-tools-kiln-$ADAPTER.zip" -D /tmp/building-tools-published
              cmp "dist/building-tools-kiln-$ADAPTER.zip" "/tmp/building-tools-published/building-tools-kiln-$ADAPTER.zip"
              cat >> /tmp/buildingtools-release.md <<'ACCEPTANCE'

          GAMEPLAY ACCEPTANCE: On 17 November 2026 the user confirmed
          Building Tools 0.33.2 working in-game. Ingredient-deduction counts
          and save/reload conservation were not separately reported.
          ACCEPTANCE
              gh release edit "$TAG" --prerelease=false --notes-file /tmp/buildingtools-release.md
              echo "Promoted accepted, byte-identical release; no assets overwritten"
            else
              echo "Existing release retained; no assets overwritten"
            fi
            exit 0
          fi
          release_flags=()
          if [[ "$PRERELEASE" == "true" ]]; then
            cat >> /tmp/buildingtools-release.md <<'WARNING'

          RELEASE STATUS: OWNER-APPROVED PRERELEASE; GAMEPLAY VERIFICATION PENDING.
          This upstream version has not been reported as tested in game.
          Back up saves and verify Magic Chest ingredient deductions and
          save/reload consistency before routine use.
          WARNING
            release_flags+=(--prerelease)
          fi
          gh release create "$TAG" \
            "dist/building-tools-kiln-$ADAPTER.zip" \
            "dist/building-tools-kiln-$ADAPTER.zip.sha256" \
            --verify-tag --latest=false "${release_flags[@]}" \
            --title "Building Tools for Kiln $ADAPTER" \
            --notes-file /tmp/buildingtools-release.md
