name: Experimental native cross-base recipe-payment safety

on:
  push:
    branches: ['feature/cross-base-storage-kiln']
    paths:
      - 'sdk-proposals/native-craft-payment/**'
      - 'scripts/resolve-kiln-release.py'
      - '.github/workflows/kiln-native-payment.yml'
  pull_request:
    paths:
      - 'sdk-proposals/native-craft-payment/**'
      - 'scripts/resolve-kiln-release.py'
      - '.github/workflows/kiln-native-payment.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-linux:
    name: Host native payment tests + current Kiln API seam (Linux)
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: GCC C++20 strict build and test
        shell: bash
        run: |
          for suite in payment_plan_tests native_take_adapter_tests recipe_payment_bridge_tests engine_hook_tests tx-source-provider-tests selected_costs_tests recipe_metadata_tests; do
            g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic \
              "sdk-proposals/native-craft-payment/$suite.cpp" -o "/tmp/$suite-gcc"
            "/tmp/$suite-gcc"
          done

      - name: Clang C++20 strict build and test
        shell: bash
        run: |
          for suite in payment_plan_tests native_take_adapter_tests recipe_payment_bridge_tests engine_hook_tests tx-source-provider-tests selected_costs_tests recipe_metadata_tests; do
            clang++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic \
              "sdk-proposals/native-craft-payment/$suite.cpp" -o "/tmp/$suite-clang"
            "/tmp/$suite-clang"
          done

      - name: Resolve latest PUBLISHED Kiln dev release (not moving main)
        shell: bash
        run: python3 scripts/resolve-kiln-release.py

      - name: Inspect current released original recipe-payment seam (read-only)
        shell: bash
        run: |
          source .kiln-release.env
          git init -q .kiln-current
          git -C .kiln-current remote add origin https://github.com/frostdev-ops/kiln.git
          git -C .kiln-current fetch --depth=1 origin "refs/tags/$KILN_UPSTREAM_TAG"
          git -C .kiln-current checkout --detach -q 'FETCH_HEAD^{commit}'
          python3 sdk-proposals/native-craft-payment/check-upstream.py .kiln-current

  native-windows:
    name: Host native payment tests (Windows MSVC x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Compile the pure native planner with MSVC
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++20 /W4 /WX /EHsc /utf-8 sdk-proposals/native-craft-payment/payment_plan_tests.cpp /Fe:%TEMP%\cbpay-msvc.exe
          if errorlevel 1 exit /b 1
          "%TEMP%\cbpay-msvc.exe"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /W4 /WX /EHsc /utf-8 sdk-proposals/native-craft-payment/native_take_adapter_tests.cpp /Fe:%TEMP%\cbpay-native-msvc.exe
          if errorlevel 1 exit /b 1
          "%TEMP%\cbpay-native-msvc.exe"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /W4 /WX /EHsc /utf-8 sdk-proposals/native-craft-payment/recipe_payment_bridge_tests.cpp /Fe:%TEMP%\cbpay-bridge-msvc.exe
          if errorlevel 1 exit /b 1
          "%TEMP%\cbpay-bridge-msvc.exe"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /W4 /WX /EHsc /utf-8 sdk-proposals/native-craft-payment/engine_hook_tests.cpp /Fe:%TEMP%\cbpay-hook-msvc.exe
          if errorlevel 1 exit /b 1
          "%TEMP%\cbpay-hook-msvc.exe"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /W4 /WX /EHsc /utf-8 sdk-proposals/native-craft-payment/tx-source-provider-tests.cpp /Fe:%TEMP%\cbpay-source-msvc.exe
          if errorlevel 1 exit /b 1
          "%TEMP%\cbpay-source-msvc.exe"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /W4 /WX /EHsc /utf-8 sdk-proposals/native-craft-payment/selected_costs_tests.cpp /Fe:%TEMP%\cbpay-selected-msvc.exe
          if errorlevel 1 exit /b 1
          "%TEMP%\cbpay-selected-msvc.exe"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /W4 /WX /EHsc /utf-8 sdk-proposals/native-craft-payment/recipe_metadata_tests.cpp /Fe:%TEMP%\cbpay-metadata-msvc.exe
          if errorlevel 1 exit /b 1
          "%TEMP%\cbpay-metadata-msvc.exe"
          if errorlevel 1 exit /b 1
      - name: Confirm that this is isolated host logic only
        shell: pwsh
        run: |
          Write-Output 'No kiln DLL was built or installed. No in-game crafts or inventory mutations were run.'
