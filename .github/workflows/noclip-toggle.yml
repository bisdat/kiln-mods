name: Package NoClip Toggle

on:
  push:
    branches: [main]
    paths:
      - 'NoClipToggle/**'
      - 'tests/noclip-toggle/**'
      - 'scripts/build-compat.py'
      - 'scripts/build-compat.sh'
      - 'scripts/resolve-kiln-release.py'
      - '.github/workflows/noclip-toggle.yml'
  pull_request:
    paths:
      - 'NoClipToggle/**'
      - 'tests/noclip-toggle/**'
      - 'scripts/build-compat.py'
      - '.github/workflows/noclip-toggle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noclip-toggle-build
  cancel-in-progress: true

jobs:
  package:
    name: Build NoClip Toggle against official Kiln SDK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify NoClip Toggle API boundary
        run: python3 -m unittest discover -s tests/noclip-toggle -p 'test_*.py' -v
      - name: Verify published Kiln SDK and package mod
        run: bash scripts/build-compat.sh NoClipToggle
      - name: Upload installable ZIP and SDK provenance
        uses: actions/upload-artifact@v4
        with:
          name: noclip-toggle-0.1.1
          path: |
            bin/Release/noclip-toggle-0.1.1.zip
            bin/Release/kiln-sdk-provenance.json
          if-no-files-found: error
          retention-days: 90
