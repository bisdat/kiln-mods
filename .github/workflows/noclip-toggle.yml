name: Package NoClip Toggle

on:
  push:
    branches: [main]
    paths:
      - 'NoClipToggle/**'
      - 'tests/noclip-toggle/**'
      - 'scripts/build-compat.py'
      - 'scripts/build-compat.sh'
      - 'scripts/resolve-kiln-release.py'
      - '.github/workflows/noclip-toggle.yml'
  pull_request:
    paths:
      - 'NoClipToggle/**'
      - 'tests/noclip-toggle/**'
      - 'scripts/build-compat.py'
      - '.github/workflows/noclip-toggle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noclip-toggle-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build NoClip Toggle against official Kiln SDK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify NoClip Toggle API boundary
        run: python3 -m unittest discover -s tests/noclip-toggle -p 'test_*.py' -v
      - name: Verify published Kiln SDK and package mod
        run: bash scripts/build-compat.sh NoClipToggle
      - name: Upload installable ZIP and SDK provenance
        uses: actions/upload-artifact@v4
        with:
          name: noclip-toggle-0.1.1
          path: |
            bin/Release/noclip-toggle-0.1.1.zip
            bin/Release/kiln-sdk-provenance.json
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish accepted NoClip Toggle v0.1.1
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: noclip-toggle-0.1.1
          path: dist
      - name: Check release package
        shell: bash
        run: test -s dist/noclip-toggle-0.1.1.zip
      - name: Publish independent versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: noclip-toggle-v0.1.1
          target_commitish: ${{ github.sha }}
          name: NoClip Toggle v0.1.1
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            NoClip Toggle v0.1.1: remappable unmodified backtick key, tested in-game
            on Bazzite Linux/Steam Proton. Uses Kiln's built-in NoClip instead of
            adding collision or flight hooks.

            Requires Kiln 0.2.0-dev.27+ and allowNoClip: true in the active profile's
            rules.json. NoClip ends safely inside terrain using Kiln's native recovery.

            Upgrading from the original Ctrl+F10 test build? In the Kiln Keys menu,
            reset NoClip Toggle to its default to use backtick. Kiln preserves
            previously chosen bindings.
          files: dist/noclip-toggle-0.1.1.zip
