name: Test Base Cleanup v0.3.4 material37 staged workflow (release after merge only)

on:
  pull_request:
    paths:
      - 'BaseCleanup/**'
      - 'tests/base-cleanup/**'
      - 'build-stage1.sh'
      - '.github/workflows/base-cleanup-stage1.yml'
  push:
    branches: [main]
    paths:
      - 'BaseCleanup/**'
      - 'tests/base-cleanup/**'
      - 'build-stage1.sh'
      - '.github/workflows/base-cleanup-stage1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and package Base Cleanup v0.3.4 candidate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate scanner, cleanup and decay safety invariants
        run: python3 -m unittest discover -s tests/base-cleanup -p 'test_*.py' -v
      - name: Fetch checksum-verified official Kiln dev.30.6 SDK
        run: python3 BaseCleanup/fetch-sdk.py
      - name: Restore Kiln dependencies
        run: dotnet restore BaseCleanup/BaseCleanup.csproj --configfile NuGet.Config
      - name: Compile Base Cleanup candidate
        run: dotnet build BaseCleanup/BaseCleanup.csproj -c Release --no-restore
      - name: KilnPack installable ZIP
        run: dotnet build BaseCleanup/BaseCleanup.csproj -c Release --no-restore -t:KilnPack
      - name: Verify installable archive
        run: |
          test -s bin/Release/base-cleanup-0.3.4.zip
          unzip -t bin/Release/base-cleanup-0.3.4.zip
          unzip -l bin/Release/base-cleanup-0.3.4.zip
      - name: Upload verified installable Base Cleanup ZIP
        uses: actions/upload-artifact@v4
        with:
          name: base-cleanup-staged-0.3.4-test
          path: bin/Release/base-cleanup-0.3.4.zip
          if-no-files-found: error
          retention-days: 90


  release:
    name: Tag and publish accepted Base Cleanup v0.3.4
    # PR builds never publish. Only the exact tested main commit may be tagged.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: base-cleanup-v0.3.4-release
      cancel-in-progress: false
    steps:
      - name: Checkout exact accepted main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download artifact from this verified workflow run
        uses: actions/download-artifact@v4
        with:
          name: base-cleanup-staged-0.3.4-test
          path: dist
      - name: Verify release version and installable ZIP
        run: |
          grep -Fq '<Version>0.3.4</Version>' BaseCleanup/BaseCleanup.csproj
          test -s dist/base-cleanup-0.3.4.zip
          unzip -t dist/base-cleanup-0.3.4.zip
          sha256sum dist/base-cleanup-0.3.4.zip
      - name: Create annotated tag if absent, refuse conflicting tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag='base-cleanup-v0.3.4'
          # Do not force-push or retag a published release.
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            existing="$(git rev-list -n 1 "$tag")"
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $tag exists at $existing, expected $GITHUB_SHA"
              exit 1
            fi
            echo "Tag already points to accepted commit."
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$tag" "$GITHUB_SHA" -m 'Base Cleanup v0.3.4 — terrain cell 37 test'
            git push origin "refs/tags/$tag"
          fi
      - name: Publish verified package if release absent
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag='base-cleanup-v0.3.4'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; never overwrite assets."
            exit 0
          fi
          cat > release-notes.md <<'NOTES'
          ## Base Cleanup v0.3.4

          Staged, recoverable Flame Altar cleanup. The UI now progresses
          through Scan → choose options → prepare → REMOVE → UNDO.
          Each REMOVE requires a fresh complete read-only survey and a
          reviewed plan, then creates an independent, permanent per-operation
          Undo journal and verified full-world backup before any voxel edit.
          Multiple successful operations can be rolled back individually,
          **newest first**. After Undo, the UI returns to Scan rather than
          offering an already-consumed REMOVE action.

          The optional mud target remains **terrain material 37 instead of 91**.
          IMPORTANT: material 37 may form metres-deep creek/ditch terrain;
          enabling it excavates ALL matching voxels in the 3-D Flame Altar.
          It does NOT just erase a surface puddle. Check counts and make
          a separate save copy before enabling this option.

          - Rubble is always included. Mycelium, material-37 mud, and cosmetic
            decay repair are independently switchable (default ON).
          - Cosmetic decay clears only weather bit 0x8000, preserving
            material, building structure, ivy/overgrowth and other paint.
          - Window hotkey: Shift+ScrollLock (already verified in-game).
          - Guarded compare-and-write preserves unrelated user changes.
          - Saved v0.2.0, v0.3.2 and v0.3.3 recovery journals remain intact.
            New operations use a separate indexed v0.3.4 journal series,
            capped at 32 per altar to prevent accidental journal overwrites.
          - The earlier v0.3.3 material-37 in-game test changed 199,135
            voxels and restored all 199,135 with zero conflicts. This
            validates the terrain cleanup, **not** the new v0.3.4 UI.
            v0.3.4 requires its own in-game acceptance before release.

          Install attached **base-cleanup-0.3.4.zip** through Kiln Launcher.
          Built against Kiln dev.30.6; a compatible runtime is required.

          **Safety:** Keep a separate save copy before bulk terrain edits.
          A full-world restore of a hosted Steam/Proton save must be done
          manually, game closed, with matching Kiln mod-data generations.
          Selective Undo only restores voxels still in the expected edited
          state and does not override new player/world edits.
          NOTES
          gh release create "$tag" dist/base-cleanup-0.3.4.zip \
            --verify-tag --target "$GITHUB_SHA" \
            --title 'Base Cleanup v0.3.4' \
            --notes-file release-notes.md
          gh release view "$tag" --json url,assets --jq '{url: .url, assets: [.assets[].name]}'
