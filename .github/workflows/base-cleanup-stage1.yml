name: Test and publish accepted Base Cleanup v0.3.2

on:
  pull_request:
    paths:
      - 'BaseCleanup/**'
      - 'tests/base-cleanup/**'
      - 'build-stage1.sh'
      - '.github/workflows/base-cleanup-stage1.yml'
  push:
    branches: [main]
    paths:
      - 'BaseCleanup/**'
      - 'tests/base-cleanup/**'
      - 'build-stage1.sh'
      - '.github/workflows/base-cleanup-stage1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and package Base Cleanup v0.3.2 candidate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate scanner, cleanup and decay safety invariants
        run: python3 -m unittest discover -s tests/base-cleanup -p 'test_*.py' -v
      - name: Fetch checksum-verified official Kiln dev.30.6 SDK
        run: python3 BaseCleanup/fetch-sdk.py
      - name: Restore Kiln dependencies
        run: dotnet restore BaseCleanup/BaseCleanup.csproj --configfile NuGet.Config
      - name: Compile Base Cleanup candidate
        run: dotnet build BaseCleanup/BaseCleanup.csproj -c Release --no-restore
      - name: KilnPack installable ZIP
        run: dotnet build BaseCleanup/BaseCleanup.csproj -c Release --no-restore -t:KilnPack
      - name: Verify installable archive
        run: |
          test -s bin/Release/base-cleanup-0.3.2.zip
          unzip -t bin/Release/base-cleanup-0.3.2.zip
          unzip -l bin/Release/base-cleanup-0.3.2.zip
      - name: Upload verified installable Base Cleanup ZIP
        uses: actions/upload-artifact@v4
        with:
          name: base-cleanup-decay-0.3.2-test
          path: bin/Release/base-cleanup-0.3.2.zip
          if-no-files-found: error
          retention-days: 90


  release:
    name: Tag and publish accepted Base Cleanup v0.3.2
    # PR builds never publish. Only the exact tested main commit may be tagged.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: base-cleanup-v0.3.2-release
      cancel-in-progress: false
    steps:
      - name: Checkout exact accepted main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download artifact from this verified workflow run
        uses: actions/download-artifact@v4
        with:
          name: base-cleanup-decay-0.3.2-test
          path: dist
      - name: Verify release version and installable ZIP
        run: |
          grep -Fq '<Version>0.3.2</Version>' BaseCleanup/BaseCleanup.csproj
          test -s dist/base-cleanup-0.3.2.zip
          unzip -t dist/base-cleanup-0.3.2.zip
          sha256sum dist/base-cleanup-0.3.2.zip
      - name: Create annotated tag if absent, refuse conflicting tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag='base-cleanup-v0.3.2'
          # Do not force-push or retag a published release.
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            existing="$(git rev-list -n 1 "$tag")"
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $tag exists at $existing, expected $GITHUB_SHA"
              exit 1
            fi
            echo "Tag already points to accepted commit."
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$tag" "$GITHUB_SHA" -m 'Base Cleanup v0.3.2 — short Kiln display name'
            git push origin "refs/tags/$tag"
          fi
      - name: Publish verified package if release absent
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag='base-cleanup-v0.3.2'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; never overwrite assets."
            exit 0
          fi
          cat > release-notes.md <<'NOTES'
          ## Base Cleanup v0.3.2

          The Kiln mod manager now displays the concise name **Base Cleanup**.
          This is a metadata-only patch over accepted v0.3.1 functionality.

          Accepted in-game on Enshrouded with Kiln dev.30.6.

          - Stage 1: read-only, full 3-D Flame Altar building/terrain inventory.
          - Stage 2: confirmed rubble removal, optional underwater mud and mycelium.
          - Cosmetic decay repair **ON by default**, with a toggle to disable it.
          - Decay repair clears only the building weathering flag, preserving
            materials, ivy/overgrowth, tint and geometry. Ivy removal is excluded.
          - Default hotkey: **Shift+ScrollLock** (tested in-game), replacing
            Ctrl+Shift+F10 to avoid the Ctrl evade key.
          - Mandatory full-world backup, persistent per-altar undo journal,
            guarded compare-and-write and selective UNDO.
          - Accepted in-game: **88,062 voxels cleaned** (48,183 decay and
            39,879 rubble); selective Undo restored 88,062 with zero conflicts.
          - Preserves earlier v0.2.0 recovery journals.

          Install attached **base-cleanup-0.3.2.zip** in Kiln.
          Built against Kiln dev.30.6; a compatible runtime is required.

          **Safety:** Take a separate save copy before making world edits.
          Preview is read-only and commit requires explicit REMOVE confirmation.
          On hosted Steam/Proton games, complete world-backup restore is manual
          with the game closed; selective Undo is available in-game.
          NOTES
          gh release create "$tag" dist/base-cleanup-0.3.2.zip \
            --verify-tag --target "$GITHUB_SHA" \
            --title 'Base Cleanup v0.3.2' \
            --notes-file release-notes.md
          gh release view "$tag" --json url,assets --jq '{url: .url, assets: [.assets[].name]}'
