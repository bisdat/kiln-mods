name: Test Base Cleanup v0.3.5 independent options, no saves, journal purge

on:
  pull_request:
    paths:
      - 'BaseCleanup/**'
      - 'tests/base-cleanup/**'
      - 'build-stage1.sh'
      - '.github/workflows/base-cleanup-stage1.yml'
  push:
    branches: [main]
    paths:
      - 'BaseCleanup/**'
      - 'tests/base-cleanup/**'
      - 'build-stage1.sh'
      - '.github/workflows/base-cleanup-stage1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and package Base Cleanup v0.3.5 candidate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate scanner, cleanup and decay safety invariants
        run: python3 -m unittest discover -s tests/base-cleanup -p 'test_*.py' -v
      - name: Fetch checksum-verified official Kiln dev.30.6 SDK
        run: python3 BaseCleanup/fetch-sdk.py
      - name: Restore Kiln dependencies
        run: dotnet restore BaseCleanup/BaseCleanup.csproj --configfile NuGet.Config
      - name: Compile Base Cleanup candidate
        run: dotnet build BaseCleanup/BaseCleanup.csproj -c Release --no-restore
      - name: KilnPack installable ZIP
        run: dotnet build BaseCleanup/BaseCleanup.csproj -c Release --no-restore -t:KilnPack
      - name: Verify installable archive
        run: |
          test -s bin/Release/base-cleanup-0.3.5.zip
          unzip -t bin/Release/base-cleanup-0.3.5.zip
          unzip -l bin/Release/base-cleanup-0.3.5.zip
      - name: Upload verified installable Base Cleanup ZIP
        uses: actions/upload-artifact@v4
        with:
          name: base-cleanup-selective-0.3.5-test
          path: bin/Release/base-cleanup-0.3.5.zip
          if-no-files-found: error
          retention-days: 90


  release:
    name: Tag and publish accepted Base Cleanup v0.3.5
    # PR builds never publish. Only the exact tested main commit may be tagged.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: base-cleanup-v0.3.5-release
      cancel-in-progress: false
    steps:
      - name: Checkout exact accepted main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download artifact from this verified workflow run
        uses: actions/download-artifact@v4
        with:
          name: base-cleanup-selective-0.3.5-test
          path: dist
      - name: Verify release version and installable ZIP
        run: |
          grep -Fq '<Version>0.3.5</Version>' BaseCleanup/BaseCleanup.csproj
          test -s dist/base-cleanup-0.3.5.zip
          unzip -t dist/base-cleanup-0.3.5.zip
          sha256sum dist/base-cleanup-0.3.5.zip
      - name: Create annotated tag if absent, refuse conflicting tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag='base-cleanup-v0.3.5'
          # Do not force-push or retag a published release.
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            existing="$(git rev-list -n 1 "$tag")"
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $tag exists at $existing, expected $GITHUB_SHA"
              exit 1
            fi
            echo "Tag already points to accepted commit."
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$tag" "$GITHUB_SHA" -m 'Base Cleanup v0.3.5 — selective cleanup without world backups'
            git push origin "refs/tags/$tag"
          fi
      - name: Publish verified package if release absent
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag='base-cleanup-v0.3.5'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; never overwrite assets."
            exit 0
          fi
          cat > release-notes.md <<'NOTES'
          ## Base Cleanup v0.3.5

          Selective Flame Altar cleanup, without forced whole-world
          saves, backups, or restores.

          - Stage 1: read-only Scan.
          - Stage 2: toggle rubble, creek/ditch mud (terrain material 37),
            mineable mycelium and cosmetic decay independently. All initially
            enabled to preserve prior defaults; at least one is required.
          - Stage 3: Prepare read-only plan and inspect candidate counts.
          - Stage 4: explicitly confirm REMOVE.
          - Stage 5: UNDO the latest separately journalled operation; repeat.
          - Every REMOVE registers a distinct WorldData Undo journal before
            editing. Kiln persists the edits and journal in the next ordinary
            game save. **Base Cleanup does NOT call Saves.Backup or
            Saves.Request or request any restore.**
          - Old per-world v0.2/v0.3.2/v0.3.3 journals remain readable.
          - New admin in-game chat commands: `/baseclean journals` to preview,
            then `/baseclean journals delete DELETE_ALL_JOURNALS` within
            two minutes to permanently delete this mod's current-world
            journal keys, not terrain. Changes persist at next normal save.
          - The mod intentionally does NOT purge on ordinary unload,
            shutdown or disable: doing that would destroy recoverability.
            Kiln may retain old historical sidecars and backups after a
            package uninstall; the mod cannot safely remove them.

          **Warning:** material 37 can be metres-deep terrain, so selecting
          mud may excavate creek beds or floors; review counts and test
          on a copied world. Overgrowth/ivy editing remains excluded.
          Cosmetic decay repairs only weathering bit 0x8000.

          Install attached **base-cleanup-0.3.5.zip** in Kiln.
          Built against the pinned Kiln dev.30.6 SDK.
          Verify the new no-save behavior and chat purge in-game before
          trusting this version on an important world.
          NOTES
          gh release create "$tag" dist/base-cleanup-0.3.5.zip \
            --verify-tag --target "$GITHUB_SHA" \
            --title 'Base Cleanup v0.3.5' \
            --notes-file release-notes.md
          gh release view "$tag" --json url,assets --jq '{url: .url, assets: [.assets[].name]}'
