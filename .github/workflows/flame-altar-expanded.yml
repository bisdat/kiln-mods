name: Package Flame Altar Expanded (experimental)

on:
  push:
    branches: [main, feature/flame-altar-expanded]
    paths:
      - 'FlameAltarExpanded/**'
      - '.github/workflows/flame-altar-expanded.yml'
  pull_request:
    paths:
      - 'FlameAltarExpanded/**'
      - '.github/workflows/flame-altar-expanded.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Validate Flame Altar Expanded 0.1.3 EML trial
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check Lua syntax and offline userdata-backed tests
        run: |
          luac5.4 -p FlameAltarExpanded/src/mod.lua
          luac5.4 -p FlameAltarExpanded/tests/test_patch.lua
          lua5.4 FlameAltarExpanded/tests/test_patch.lua

      - name: Validate original EML identity and strictly bounded level-4-only source
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('FlameAltarExpanded')
          m = json.loads((root / 'mod.json').read_text(encoding='utf-8'))
          assert m['id'] == 'flame-altar-expanded'
          assert m['version'] == '0.1.3'
          assert m['capabilities'] == ['patch']
          assert m['dependencies'] == []
          lua = (root / 'src/mod.lua').read_text(encoding='utf-8')
          assert 'sizes[5].x, sizes[5].y, sizes[5].z =' in lua
          assert 'resource.data = balance' in lua
          assert 'keen::RecipeRegistryResource' not in lua
          assert 'FlameAltar_HomeBase_Upgrade_4' not in lua
          assert 'table.insert' not in lua
          assert 'altarLevelMax == 5' in lua
          assert 'local LEVEL4_SIZE = 240' in lua
          assert 'LEVEL4_SIZE < 256' in lua
          assert 'sizes[6].x' not in lua
          print('Original EML identity, 0.1.3 version and level-4-only patch validated')
          PY

      - name: Stage root-layout Kiln drag-and-drop mod ZIP
        run: |
          mkdir -p dist/flame-altar-expanded/src
          cp FlameAltarExpanded/mod.json dist/flame-altar-expanded/mod.json
          cp FlameAltarExpanded/src/mod.lua dist/flame-altar-expanded/src/mod.lua
          cp FlameAltarExpanded/README.md dist/flame-altar-expanded/README.md
          python3 - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          stage = Path('dist/flame-altar-expanded')
          files = sorted(p.relative_to(stage).as_posix() for p in stage.rglob('*') if p.is_file())
          assert files == ['README.md', 'mod.json', 'src/mod.lua'], files
          dst = Path('dist/flame-altar-expanded-0.1.3.zip')
          with ZipFile(dst, 'w', ZIP_DEFLATED) as z:
              for name in files:
                  z.write(stage / name, name)
          with ZipFile(dst) as z:
              assert sorted(z.namelist()) == files
              m = json.loads(z.read('mod.json'))
              assert m['id'] == 'flame-altar-expanded' and m['version'] == '0.1.3'
              assert z.read('src/mod.lua').startswith(b'-- SPDX-License-Identifier')
          assert dst.stat().st_size > 0
          print('Direct install ZIP verified:', dst)
          PY

      # CI artifact is deliberately test-only: no GitHub Release is published.
      - name: Upload level-4 experiment (direct install ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: flame-altar-expanded-0.1.3-test
          path: dist/flame-altar-expanded-0.1.3.zip
          if-no-files-found: error
          retention-days: 30
