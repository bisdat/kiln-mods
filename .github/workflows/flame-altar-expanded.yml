name: Package Flame Altar Expanded (experimental)

on:
  push:
    branches: [main]
    paths:
      - 'FlameAltarExpanded/**'
      - '.github/workflows/flame-altar-expanded.yml'
  pull_request:
    paths:
      - 'FlameAltarExpanded/**'
      - '.github/workflows/flame-altar-expanded.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Validate and package EML mod
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Validate mod syntax and offline contracts
        run: |
          luac5.4 -p FlameAltarExpanded/src/mod.lua
          luac5.4 -p FlameAltarExpanded/tests/test_patch.lua
          lua5.4 FlameAltarExpanded/tests/test_patch.lua

      - name: Check EML manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('FlameAltarExpanded/mod.json').read_text())
          assert manifest['id']=='flame-altar-expanded'
          assert manifest['capabilities']==['patch']
          assert manifest['version']=='0.1.0'
          assert Path('FlameAltarExpanded/src/mod.lua').is_file()
          print('EML manifest verified')
          PY

      # The artifact downloaded from Actions is ALREADY a ZIP. Upload files rather
      # than an inner ZIP, otherwise Kiln (correctly) treats the inner ZIP as an
      # opaque asset and does not import the EML mod on drag and drop.
      - name: Stage drag-and-drop Kiln mod
        run: |
          mkdir -p dist/flame-altar-expanded/src
          cp FlameAltarExpanded/mod.json dist/flame-altar-expanded/mod.json
          cp FlameAltarExpanded/src/mod.lua dist/flame-altar-expanded/src/mod.lua
          cp FlameAltarExpanded/README.md dist/flame-altar-expanded/README.md
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          stage = Path("dist/flame-altar-expanded")
          files = sorted(p.relative_to(stage).as_posix() for p in stage.rglob("*") if p.is_file())
          assert files == ["README.md", "mod.json", "src/mod.lua"], files
          # Simulate the GitHub Actions artifact archive: the manifest and src
          # must be at the ZIP root (no containing directory or nested ZIP).
          with ZipFile("dist/drag-drop-smoke-test.zip", "w") as z:
              for path in files:
                  z.write(stage / path, path)
          with ZipFile("dist/drag-drop-smoke-test.zip") as z:
              assert sorted(z.namelist()) == files
              assert z.read("src/mod.lua").startswith(b"-- SPDX-License-Identifier")
          print("Kiln UI drag-and-drop archive layout verified")
          PY

      - name: Upload directly installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: flame-altar-expanded-0.1.0-kiln
          # upload-artifact produces the ONE ZIP to drag onto Kiln's window.
          # The directory itself is stripped; mod.json is at the ZIP root.
          path: dist/flame-altar-expanded/
          if-no-files-found: error
          retention-days: 90
