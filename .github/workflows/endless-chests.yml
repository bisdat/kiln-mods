name: Package Endless Chests (Kiln)

on:
  push:
    branches: [main]
    tags: ['endless-chests-v*']
    paths:
      - 'EndlessChests/**'
      - 'scripts/**'
      - 'NuGet.Config'
      - '.github/workflows/endless-chests.yml'
  pull_request:
    paths:
      - 'EndlessChests/**'
      - 'scripts/**'
      - 'NuGet.Config'
      - '.github/workflows/endless-chests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build Endless Chests
    runs-on: ubuntu-24.04
    env:
      # Use the released Kiln SDK commit, not a newer development main,
      # to avoid an unwarranted 'needs a newer Kiln' launcher warning.
      KILN_UPSTREAM_SHA: eba9a5e1e0e0044a9146fdd53021a751e2957030
      KILN_SDK_VERSION: 0.2.0-dev.local.20261107.61500
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate release tag against mod version
        if: startsWith(github.ref, 'refs/tags/endless-chests-v')
        shell: bash
        run: |
          version="$(awk -F'[<>]' '/<Version>/ {print $3; exit}' EndlessChests/EndlessChests.csproj)"
          if [[ -z "$version" || "$GITHUB_REF_NAME" != "endless-chests-v$version" ]]; then
            echo "::error::Tag must be endless-chests-v$version"
            exit 1
          fi

      - name: Verify the original 195 named groups and disabled defaults
        run: python3 scripts/validate-endless-ini.py

      - name: Test in-game FNV-1a64 name fingerprints and collisions
        run: python3 scripts/test-chest-name-hashes.py

      - name: Build Kiln SDK and package mod
        run: bash scripts/build.sh EndlessChests

      - name: Upload installable mod
        uses: actions/upload-artifact@v4
        with:
          name: endless-chests-kiln-package
          path: bin/Release/endless-chests-kiln-*.zip
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish version-tagged release
    needs: package
    if: startsWith(github.ref, 'refs/tags/endless-chests-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: endless-chests-kiln-package
          path: dist

      - name: Attach ZIP to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/endless-chests-kiln-*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
