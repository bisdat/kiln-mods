name: Check and publish Building Tools for Kiln

on:
  push:
    branches: [main]
    paths:
      - 'BuildingToolsKiln/**'
      - '.github/workflows/buildingtools-upstream-watch.yml'
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

# A single writer prevents two scheduled/manual runs assigning the same
# adapter version. The bot's automation-branch/tag pushes do NOT trigger more workflows.
concurrency:
  group: building-tools-automated-prerelease
  cancel-in-progress: false

jobs:
  check-build-publish:
    if: github.repository == 'bisdat/kiln-mods' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore durable automated pin branch (main stays protected)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="automation/building-tools-release-pins"
          # GitHub's protected main branch is never modified by this workflow.
          # The automation branch is append-only: each release keeps its
          # upstream pin, and includes the latest source from main.
          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null; then
            git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            git switch --create auto-building-tools "refs/remotes/origin/$BRANCH"
            git merge --no-edit refs/remotes/origin/main
          else
            git switch --create auto-building-tools "$GITHUB_SHA"
          fi
      - name: Find latest stable upstream release and wait for official assets
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/AleksanderWojtal-CC/Enshrouded-BuildingTools/releases/latest \
            > /tmp/building-tools-upstream-release.json
          python3 BuildingToolsKiln/release_assets.py \
            /tmp/building-tools-upstream-release.json >> "$GITHUB_OUTPUT"

      - name: Download official ZIP and validate its published SHA256
        if: steps.latest.outputs.ready == 'true'
        id: checksum
        env:
          VERSION: ${{ steps.latest.outputs.version }}
          CHECKSUM_ASSET: ${{ steps.latest.outputs.checksum_asset }}
        run: |
          set -euo pipefail
          BASE="https://github.com/AleksanderWojtal-CC/Enshrouded-BuildingTools/releases/download/v$VERSION"
          mkdir -p /tmp/buildingtools-official-checksums
          curl -fsSL --retry 3 "$BASE/EnshroudedBuildingTools-$VERSION.zip" \
            -o "/tmp/EnshroudedBuildingTools-$VERSION.zip"
          curl -fsSL --retry 3 "$BASE/$CHECKSUM_ASSET" \
            -o "/tmp/buildingtools-official-checksums/$CHECKSUM_ASSET"
          python3 BuildingToolsKiln/official_checksum.py \
            --archive "/tmp/EnshroudedBuildingTools-$VERSION.zip" \
            --checksum "/tmp/buildingtools-official-checksums/$CHECKSUM_ASSET" \
            --normalized "/tmp/EnshroudedBuildingTools-$VERSION.zip.sha256" >> "$GITHUB_OUTPUT"

      - name: Pin upstream bytes and decide whether prerelease is missing
        if: steps.latest.outputs.ready == 'true'
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.latest.outputs.version }}
          SHA256: ${{ steps.checksum.outputs.sha256 }}
        run: |
          set -euo pipefail
          # The current 0.34.0 pin has never been released. An unchanged pin
          # with a missing tag/release MUST still be published automatically.
          python3 BuildingToolsKiln/propose_update.py \
            --upstream-version "$VERSION" --sha256 "$SHA256"
          if git diff --quiet -- BuildingToolsKiln/release.json; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi
          ADAPTER="$(python3 -c 'import json; print(json.load(open("BuildingToolsKiln/release.json"))["adapter_version"])')"
          TAG="building-tools-kiln-v$ADAPTER"
          echo "adapter=$ADAPTER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # An existing immutable release is never republished or overwritten.
            # It must also correspond to the currently pinned upstream version.
            if ! git diff --quiet -- BuildingToolsKiln/release.json; then
              echo "::error::Release tag collision for updated upstream pin: $TAG"
              exit 1
            fi
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "UNCHANGED: $TAG already published; assets left intact"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "CANDIDATE: upstream v$VERSION -> adapter v$ADAPTER; automated prerelease"
          fi

      - name: Run full regression suite and package the candidate
        if: steps.candidate.outputs.publish == 'true'
        env:
          ADAPTER: ${{ steps.candidate.outputs.adapter }}
          UPSTREAM: ${{ steps.latest.outputs.version }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s BuildingToolsKiln/tests -p 'test_*.py' -v
          mkdir -p dist
          python3 BuildingToolsKiln/package.py \
            "/tmp/EnshroudedBuildingTools-$UPSTREAM.zip" \
            --checksum "/tmp/EnshroudedBuildingTools-$UPSTREAM.zip.sha256" \
            --output "dist/building-tools-kiln-$ADAPTER.zip"
          (cd dist && sha256sum "building-tools-kiln-$ADAPTER.zip" \
            > "building-tools-kiln-$ADAPTER.zip.sha256")
          python3 - <<'PY'
          import json, os, zipfile
          p=json.load(open("BuildingToolsKiln/release.json",encoding="utf-8"))
          root="kiln/native/building-tools/"
          archive="dist/building-tools-kiln-"+os.environ["ADAPTER"]+".zip"
          upstream="/tmp/EnshroudedBuildingTools-"+os.environ["UPSTREAM"]+".zip"
          with zipfile.ZipFile(archive) as z, zipfile.ZipFile(upstream) as u:
              names=set(z.namelist())
              assert not any(n.startswith("/") or ".." in n.split("/") for n in names)
              assert not any(n.casefold()=="dinput8.dll" or n.casefold().endswith("/dinput8.dll") for n in names)
              for dest, source in (
                  ("BuildingTools.dll","dinput8.dll"),
                  ("BuildingTools-LICENSE.txt","BuildingTools-LICENSE.txt"),
                  ("BuildingTools-README.txt","BuildingTools-README.txt")
              ):
                  assert z.read(root+dest)==u.read(source),dest
              assert any(n.startswith("BuildingTools-Languages/") for n in names)
              manifest=json.loads(z.read(root+"native.json"))
              assert manifest["id"]=="building-tools"
              assert manifest["version"]==p["adapter_version"]
              assert manifest["side"]=="client" and manifest["dlls"]==["BuildingTools.dll"]
              provenance=json.loads(z.read(root+"provenance.json"))
              assert provenance["upstream_archive_sha256"]==p["upstream_sha256"]
              assert provenance["gameplay_verified"] is False
          print("PASS original DLL/licence/translations intact, native manifest/provenance valid")
          PY
          python3 BuildingToolsKiln/package.py \
            "/tmp/EnshroudedBuildingTools-$UPSTREAM.zip" \
            --checksum "/tmp/EnshroudedBuildingTools-$UPSTREAM.zip.sha256" \
            --output "/tmp/building-tools-kiln-$ADAPTER-repeat.zip"
          cmp "dist/building-tools-kiln-$ADAPTER.zip" \
            "/tmp/building-tools-kiln-$ADAPTER-repeat.zip"
          (cd dist && sha256sum --check "building-tools-kiln-$ADAPTER.zip.sha256")
          echo "PASS byte-for-byte reproducible install ZIP and checksum"

      - name: Upload installable candidate (even if GitHub publication is blocked)
        if: steps.candidate.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: building-tools-kiln-${{ steps.candidate.outputs.adapter }}
          path: |
            dist/building-tools-kiln-${{ steps.candidate.outputs.adapter }}.zip
            dist/building-tools-kiln-${{ steps.candidate.outputs.adapter }}.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Record version on automation branch, tag and publish prerelease
        if: steps.candidate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.candidate.outputs.tag }}
          ADAPTER: ${{ steps.candidate.outputs.adapter }}
          UPSTREAM: ${{ steps.latest.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Never bypass the protected main branch. If it changed during this
          # run, abort and retry later with the newly reviewed source.
          REMOTE_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$REMOTE_SHA" = "$GITHUB_SHA" || {
            echo "::error::main changed while packaging; retry using the current main"
            exit 1
          }
          if ! git diff --quiet -- BuildingToolsKiln/release.json; then
            git add BuildingToolsKiln/release.json
            git commit -m "ci(building-tools): pin official upstream $UPSTREAM for adapter $ADAPTER"
          fi
          # The append-only automation branch is the durable upstream pin.
          # A normal push is non-force, rejecting unexpected concurrent changes.
          git push origin HEAD:refs/heads/automation/building-tools-release-pins
          # A GitHub Actions bot push does not trigger downstream workflows;
          # this run performs version pin, build, tag and release itself.
          TARGET_SHA="$(git rev-parse HEAD)"
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$TARGET_SHA" || {
              echo "::error::Existing tag $TAG points to a different commit"
              exit 1
            }
          else
            git tag "$TAG" "$TARGET_SHA"
            git push origin "refs/tags/$TAG"
          fi
          # Never modify a previously published release or its assets.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Existing release $TAG retained without changes"
            exit 0
          fi
          cat > /tmp/building-tools-auto-prerelease.md <<NOTES
          AUTOMATED CI-VERIFIED PRERELEASE — GAMEPLAY UNTESTED

          Building Tools for Kiln adapter $ADAPTER, wrapping official upstream
          Building Tools $UPSTREAM by Aleksander Wojtal. The original upstream
          DLL is unchanged. Only the official ZIP and SHA256 are accepted.
          CI verifies packaging tests, manifest, licence, original DLL bytes,
          checksum, archive safety and deterministic ZIP reproducibility.

          This release has NOT been verified in Enshrouded. In particular,
          cross-base Magic Chest crafting, material debit, multiplayer and
          save/reload consistency must still be tested in game. Back up saves
          before installing. No gameplay acceptance is inferred from CI.

          Do not replace Kiln's game-root dinput8.dll. Extract the install
          ZIP into the Enshrouded game root; preserve BuildingTools.ini.
          Enable cross-base Magic Chests via Home > Options.

          Source and update policy:
          https://github.com/bisdat/kiln-mods/tree/main/BuildingToolsKiln
          NOTES
          gh release create "$TAG" \
            "dist/building-tools-kiln-$ADAPTER.zip" \
            "dist/building-tools-kiln-$ADAPTER.zip.sha256" \
            --verify-tag --prerelease --latest=false \
            --title "Building Tools for Kiln $ADAPTER (CI verified; gameplay untested)" \
            --notes-file /tmp/building-tools-auto-prerelease.md
