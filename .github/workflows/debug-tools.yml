name: Package Debug Tools

on:
  push:
    branches: [main]
    tags: ['debug-tools-v*']
    paths:
      - 'DebugTools/**'
      - 'scripts/build.sh'
      - '.github/workflows/debug-tools.yml'
  pull_request:
    paths:
      - 'DebugTools/**'
      - 'scripts/build.sh'
      - '.github/workflows/debug-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify source safety contracts
        run: python3 -m unittest discover -s DebugTools/tests -p 'test_*.py' -v
      - name: Build and package against pinned Kiln SDK
        run: bash scripts/build.sh DebugTools
      - uses: actions/upload-artifact@v4
        with:
          name: debug-tools-0.1.0-test
          path: bin/Release/debug-tools-0.1.0.zip
          if-no-files-found: error
          retention-days: 90

  release:
    if: startsWith(github.ref, 'refs/tags/debug-tools-v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" == "debug-tools-v0.1.0" ]] || { echo "::error::Unexpected Debug Tools tag"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: debug-tools-0.1.0-test
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/debug-tools-0.1.0.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
