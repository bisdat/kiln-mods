name: Follow latest Kiln development release

# One daily SDK-compatibility check; per-mod workflows handle ordinary source
# changes. Runtime/launcher-only upstream patches have no SDK to test.
# Full eight-mod checks run on a new SDK, compatible tooling PRs, or manual force.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kiln-latest.yml'
      - 'scripts/resolve-kiln-release.py'
      - 'scripts/build-compat.sh'
      - 'scripts/build-compat.py'
      - 'tests/kiln-release/**'
  pull_request:
    paths:
      - '.github/workflows/kiln-latest.yml'
      - 'scripts/resolve-kiln-release.py'
      - 'scripts/build-compat.sh'
      - 'scripts/build-compat.py'
      - 'tests/kiln-release/**'
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild all eight mods even if this SDK release already passed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kiln-latest-release-follow
  cancel-in-progress: false

jobs:
  check:
    name: Verify newest Kiln SDK and active source
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      source_short: ${{ steps.source.outputs.short }}
      release_tag: ${{ steps.release.outputs.tag }}
      release_version: ${{ steps.release.outputs.version }}
      build: ${{ steps.gate.outputs.build }}
      cache_hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4

      - name: Record exact active mod source revision
        id: source
        shell: bash
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:12}" >> "$GITHUB_OUTPUT"

      - name: Test release selection without contacting GitHub
        run: python3 -m unittest discover -s tests/kiln-release -p 'test_*.py' -v

      - name: Validate compatibility build entrypoint syntax
        run: |
          bash -n scripts/build-compat.sh
          python3 -m py_compile scripts/build-compat.py

      - name: Resolve newest published Kiln SDK release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/resolve-kiln-release.py

      - name: Find prior successful build for this SDK release
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .kiln-release-success.txt
          key: kiln-sdk-verified-all8-v1-${{ steps.release.outputs.version }}
          lookup-only: true

      - name: Build on compatibility PR, new SDK, or force
        id: gate
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          FORCE: ${{ inputs.force }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" || "$FORCE" == "true" || "$CACHE_HIT" != "true" ]]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build=false' >> "$GITHUB_OUTPUT"
            echo 'This Kiln SDK release already passed the eight-mod compatibility checks.'
          fi

  package:
    needs: check
    if: needs.check.outputs.build == 'true'
    name: "${{ matrix.mod }} on ${{ needs.check.outputs.release_tag }}"
    strategy:
      fail-fast: false
      matrix:
        mod: [SurvivalQoL, EndlessChests, NoClipToggle, BaseStationMagicStorage, GemForgeStorage, BaseCleanup]
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ github.token }}
      KILN_RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
      KILN_SDK_VERSION: ${{ needs.check.outputs.release_version }}
    steps:
      - name: Check out exact verified mod source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.source_sha }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate mod-specific source contracts
        shell: bash
        run: |
          case "${{ matrix.mod }}" in
            EndlessChests)
              # The 0.5.x catalogue is JSON-owned; INI is settings only.
              python3 scripts/validate-endless-settings.py
              python3 scripts/test-chest-name-hashes.py
              python3 scripts/test-chest-case.py
              ;;
            SurvivalQoL)
              python3 -m unittest discover -s tests/survival-qol -p 'test_*.py' -v
              dotnet run --project tests/survival-qol/DepletionMathTests/DepletionMathTests.csproj -c Release
              ;;
            NoClipToggle)
              python3 -m unittest discover -s tests/noclip-toggle -p 'test_*.py' -v
              ;;
            BaseStationMagicStorage)
              python3 -m unittest discover -s tests/base-station-magic-storage -p 'test_*.py' -v
              ;;
            GemForgeStorage)
              python3 -m unittest discover -s tests/gemforge-storage -p 'test_*.py' -v
              ;;
            BaseCleanup)
              python3 -m unittest discover -s tests/base-cleanup -p 'test_*.py' -v
              dotnet run --project tests/base-cleanup/BackupRetentionHarness.csproj -c Release
              ;;
            *) exit 1 ;;
          esac

      - name: Package using checksum-verified official release SDK
        run: bash scripts/build-compat.sh "${{ matrix.mod }}"

      - name: Verify Endless Chests canonical identities against exact Kiln SDK
        if: matrix.mod == 'EndlessChests'
        run: |
          python3 scripts/validate-endless-catalogue.py
          python3 scripts/test-endless-catalogue-repairs.py
          python3 scripts/test-endless-final-27.py
          python3 scripts/test-endless-weapon-groups.py

      - name: Stage Endless Chests settings INI and canonical JSON
        if: matrix.mod == 'EndlessChests'
        run: |
          cp EndlessChests/defaults/endless-chests.defaults.ini bin/Release/endless-chests.defaults.ini
          cp EndlessChests/defaults/catalogue.json bin/Release/endless-chests.catalogue.json
          cmp EndlessChests/defaults/endless-chests.defaults.ini bin/Release/endless-chests.defaults.ini
          cmp EndlessChests/defaults/catalogue.json bin/Release/endless-chests.catalogue.json

      - name: Give this mod's provenance an unambiguous filename
        run: cp bin/Release/kiln-sdk-provenance.json "bin/Release/kiln-sdk-provenance-${{ matrix.mod }}.json"

      - name: Upload verified compatibility package
        uses: actions/upload-artifact@v4
        with:
          name: "kiln-${{ needs.check.outputs.release_version }}-${{ matrix.mod }}"
          path: |
            bin/Release/*.zip
            bin/Release/kiln-sdk-provenance-${{ matrix.mod }}.json
            bin/Release/endless-chests.defaults.ini
            bin/Release/endless-chests.catalogue.json
          if-no-files-found: error
          retention-days: 90

  fishing-rod:
    needs: check
    if: needs.check.outputs.build == 'true'
    name: Enhanced Fishing Rod data-pack checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.source_sha }}
      - run: python3 -m unittest discover -s EnhancedFishingRod/tests -v
      - run: python3 EnhancedFishingRod/package.py
      - run: unzip -t dist/enhanced-fishing-rod-0.1.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: compatibility-enhanced-fishing-rod
          path: dist/enhanced-fishing-rod-*.zip
          if-no-files-found: error

  building-tools:
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/buildingtools-kiln-native-adapter.yml
    with:
      source_sha: ${{ needs.check.outputs.source_sha }}

  publish:
    name: Publish exact compatibility prerelease
    needs: [check, package, fishing-rod, building-tools]
    if: github.event_name != 'pull_request' && needs.check.outputs.build == 'true' && needs.package.result == 'success' && needs.fishing-rod.result == 'success' && needs.building-tools.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: kiln-compat-${{ needs.check.outputs.release_tag }}-r${{ needs.check.outputs.source_short }}
      KILN_RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
      KILN_RELEASE_VERSION: ${{ needs.check.outputs.release_version }}
      EXPECTED_SOURCE_SHA: ${{ needs.check.outputs.source_sha }}
    steps:
      - name: Download all six completed, verified SDK packages
        uses: actions/download-artifact@v4
        with:
          pattern: kiln-${{ needs.check.outputs.release_version }}-*
          path: dist
          merge-multiple: false

      - name: Fail closed on missing packages or mismatched provenance
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from shutil import copy2

          root, output = Path("dist"), Path("publish")
          output.mkdir(exist_ok=True)
          specs = {
              "SurvivalQoL": "survival-qol-*.zip",
              "EndlessChests": "endless-chests-kiln-*.zip",
              "NoClipToggle": "noclip-toggle-*.zip",
              "BaseStationMagicStorage": "base-station-magic-storage-*.zip",
              "GemForgeStorage": "gemforge-magic-storage-*.zip",
              "BaseCleanup": "base-cleanup-*.zip",
          }
          version = os.environ["KILN_RELEASE_VERSION"]
          tag = os.environ["KILN_RELEASE_TAG"]
          source_sha = os.environ["EXPECTED_SOURCE_SHA"]
          kiln_sha = None
          asset_hashes = None
          published = []
          for mod, pattern in specs.items():
              folder = root / f"kiln-{version}-{mod}"
              if not folder.is_dir():
                  raise SystemExit(f"Missing {mod} build artifact")
              zips = list(folder.glob(pattern))
              if len(zips) != 1 or zips[0].stat().st_size == 0:
                  raise SystemExit(f"Expected one nonempty ZIP for {mod}: {zips}")
              metadata = folder / f"kiln-sdk-provenance-{mod}.json"
              if not metadata.is_file():
                  raise SystemExit(f"Missing SDK provenance for {mod}")
              data = json.loads(metadata.read_text(encoding="utf-8"))
              if (data.get("tag"), data.get("version"), data.get("mod")) != (tag, version, mod):
                  raise SystemExit(f"Wrong release/mod provenance for {mod}: {data}")
              if data.get("mod_source_sha") != source_sha:
                  raise SystemExit(f"Source revision mismatch for {mod}")
              checked = data.get("checked_out_sha")
              if not isinstance(checked, str) or len(checked) != 40:
                  raise SystemExit(f"Missing exact upstream commit for {mod}")
              if checked != data.get("release_target"):
                  raise SystemExit(f"Upstream tag differs from release target for {mod}")
              hashes = data.get("official_assets_sha256", {})
              wanted = {f"Kiln.Sdk.{version}.nupkg", f"Kiln.Api.{version}.nupkg"}
              if set(hashes) != wanted or any(len(h) != 64 for h in hashes.values()):
                  raise SystemExit(f"Missing verified official NuGet checksums for {mod}")
              if kiln_sha is not None and kiln_sha != checked:
                  raise SystemExit("Mods used different Kiln commits")
              if asset_hashes is not None and asset_hashes != hashes:
                  raise SystemExit("Mods used different official SDK packages")
              kiln_sha, asset_hashes = checked, hashes
              for asset in (zips[0], metadata):
                  dest = output / asset.name
                  if dest.exists():
                      raise SystemExit(f"Duplicate distribution asset: {dest.name}")
                  copy2(asset, dest)
                  published.append(dest.name)
          endless_assets = ("endless-chests.defaults.ini", "endless-chests.catalogue.json")
          for name in endless_assets:
              asset = root / f"kiln-{version}-EndlessChests" / name
              if not asset.is_file() or asset.stat().st_size == 0:
                  raise SystemExit(f"Missing Endless Chests standalone asset: {name}")
              dest = output / name
              if dest.exists():
                  raise SystemExit(f"Duplicate distribution asset: {name}")
              copy2(asset, dest)
              published.append(name)
          if len(published) != 2 * len(specs) + len(endless_assets):
              raise SystemExit(f"Incorrect asset count: {published}")
          print(f"Verified official Kiln {tag}@{kiln_sha} for mod source {source_sha}")
          for asset in published:
              print("Ready:", asset)
          PY

      - name: Publish source-and-release-specific GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ needs.check.outputs.source_sha }}
          name: "Kiln ${{ needs.check.outputs.release_tag }} compatibility — mods at ${{ needs.check.outputs.source_short }}"
          prerelease: true
          draft: false
          overwrite_files: true
          fail_on-unmatched-files: true
          files: publish/*
          body: |
            Automated compatibility build for **official Kiln ${{ needs.check.outputs.release_tag }}**.

            - **Mods built:** Survival QoL, Endless Chests, NoClip Toggle, Base Station Magic Storage, Gem Forge Magic Storage and Base Cleanup. Enhanced Fishing Rod and Building Tools passed their separate packaging checks (workflow artifacts only). Rubble Remover is excluded.
            - **Mod source:** ${{ needs.check.outputs.source_sha }}
            - **Checks:** release tag matches its published Git commit, official NuGet checksums verified, all six managed builds and contract tests passed; data-only and native packaging checks passed. Endless Chests canonical JSON item IDs and the 100 audited repairs were validated against this exact Kiln source.
            - **Provenance:** separate kiln-sdk-provenance-<mod>.json per mod, including the exact Kiln release, Git SHA and official SDK hashes.

            These are development compatibility prereleases, **not stable mod version upgrades or in-game acceptance**. Install manually through Kiln Library and back up saves before testing.

  mark-success:
    name: Cache verified Kiln SDK compatibility after publication
    needs: [check, package, fishing-rod, building-tools, publish]
    if: github.event_name != 'pull_request' && needs.check.outputs.build == 'true' && needs.check.outputs.cache_hit != 'true' && needs.package.result == 'success' && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Save verified SDK and source provenance
        run: echo "${{ needs.check.outputs.release_tag }} ${{ needs.check.outputs.source_sha }}" > .kiln-release-success.txt
      - uses: actions/cache/save@v4
        with:
          path: .kiln-release-success.txt
          key: kiln-sdk-verified-all8-v1-${{ needs.check.outputs.release_version }}
