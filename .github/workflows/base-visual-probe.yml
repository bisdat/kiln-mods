name: Test Base Visual Probe (read-only)

on:
  pull_request:
    paths:
      - 'BaseVisualProbe/**'
      - 'tests/base-visual-probe/**'
      - 'build-visual-probe.sh'
      - '.github/workflows/base-visual-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Validate and package read-only visual probe
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout experimental PR
        uses: actions/checkout@v4
      - name: .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Read-only geometry, bit masks and before/after tests
        run: python3 -m unittest discover -s tests/base-visual-probe -p 'test_*.py' -v
      - name: Fetch checksum-verified upstream Kiln dev.30.6 SDK
        run: python3 BaseCleanup/fetch-sdk.py
      - name: Restore NuGet dependencies
        run: dotnet restore BaseVisualProbe/BaseVisualProbe.csproj --configfile NuGet.Config
      - name: Compile read-only mod
        run: dotnet build BaseVisualProbe/BaseVisualProbe.csproj -c Release --no-restore
      - name: KilnPack test mod
        run: dotnet build BaseVisualProbe/BaseVisualProbe.csproj -c Release --no-restore -t:KilnPack
      - name: Check installable ZIP
        run: |
          test -s bin/Release/base-visual-probe-0.1.1.zip
          unzip -t bin/Release/base-visual-probe-0.1.1.zip
          unzip -l bin/Release/base-visual-probe-0.1.1.zip
      - name: Upload experimental artifact only
        uses: actions/upload-artifact@v4
        with:
          name: base-visual-probe-0.1.1-readonly
          path: bin/Release/base-visual-probe-0.1.1.zip
          if-no-files-found: error
          retention-days: 45
