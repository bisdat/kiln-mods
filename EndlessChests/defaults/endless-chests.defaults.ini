; Endless Chests settings, v0.5.0.
; Canonical item identities and groups are embedded in catalogue.json.
; Do not add a [Groups] section: it is ignored on upgrades.
[Options]
AllowMagicChests=1
; Reserved original options, unsupported by this Kiln item API.
EnableGemLevels=0
FullyUpgradeGear=0

[DisabledGroups]
; Magic Armor 1=1

[DisabledItems]
; Use exact decimal game item IDs; display names are not safe.
; 2012474258=1

[Aliases]
Elixir = Mysterious Flask
Shroud Meteor Shower = Shroud Meteor Scroll
